<!doctype html>
<!--
  design/desktop/overview/layered-tiles.html - cashU Overview ("Przeglad") redesigned as layered tiles.
  Content = what the app's overview shows today (apps/desktop/renderer/screens/overview): the net worth hero
  (change since last month, assets, liabilities, home equity, liquid in months of spending, other currencies)
  with "Net worth over time" folded into it (total / liquid, line / layers), Budget of the month,
  Surplus -> contribution, Investments, Assets, Loans, Accounts (+ cash in the wallet), Subscriptions.
  Style: V3 "Layered tiles" of the investments lab on the current tokens (Neutral palette, the app's
  system font, heavy numbers, 28px tiles). Data: synthetic.
  Motion: tiles rise in a 50ms stagger, the hero chart wipes in with the value following it, ring / months /
  meters / spark settle after; hover = cursor spotlight + 2px lift; scrub the chart to read any week.
  Keys: R replays the entrance, M cycles motion (normal / slow x4 / off). URL: ?still = final states.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cashU overview - layered tiles</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0a0b; --card: #0e0e10; --surface: #111113; --surface-2: #17171a; --surface-3: #1e1e22;
  --line: rgba(255, 255, 255, 0.065); --line-2: rgba(255, 255, 255, 0.11); --line-3: rgba(255, 255, 255, 0.18);
  --ink: #ededf0; --ink-2: #a3a3ab; --ink-3: #6e6e77; --ink-4: #4a4a52;
  --accent: #8ea4ff; --accent-soft: rgba(142, 164, 255, 0.13);
  --pos: #4cc38a; --pos-soft: rgba(76, 195, 138, 0.12); --neg: #ef6f6c; --neg-soft: rgba(239, 111, 108, 0.12);
  --warn: #e5a54a; --warn-soft: rgba(229, 165, 74, 0.12);
  --c1: #8ea4ff; --c2: #5cc0d6; --c3: #b39cff; --c4: #e5a54a; --c5: #5d5d66;
  --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --speed: 1; --out: cubic-bezier(0.16, 1, 0.3, 1); --io: cubic-bezier(0.65, 0, 0.35, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; }
.spacer { flex: 1; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); } .dim { color: var(--ink-2); } .dimmer { color: var(--ink-3); }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { max-width: 1200px; margin: 0 auto; padding: 0 28px 120px; }
.topbar { display: flex; align-items: center; gap: 20px; height: 56px; border-bottom: 1px solid var(--line); }
.topbar .brand img { height: 22px; display: block; }
.nav { display: flex; gap: 2px; height: 100%; }
.nav a { display: flex; align-items: center; padding: 0 10px; color: var(--ink-3); position: relative; cursor: pointer; transition: color 0.15s; }
.nav a:hover, .nav a.active { color: var(--ink); }
.nav a.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 1.5px; background: var(--ink); border-radius: 2px; }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); transition: background 0.15s, color 0.15s, transform 0.12s; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn:active { transform: scale(0.92); }
.profile { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 8px 4px 4px; border-radius: 999px; color: var(--ink-2); }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 9px; border: 0; background: var(--surface-3); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255, 255, 255, 0.04); font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background 0.15s, transform 0.12s var(--out); }
.btn:hover { background: #26262b; } .btn:active { transform: scale(0.97); }
.btn.primary { background: var(--ink); color: #0b0b0c; box-shadow: none; font-weight: 600; }
.btn.primary:hover { background: #fff; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink-2); padding: 0 8px; }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.link { color: var(--ink-3); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; cursor: pointer; transition: color 0.15s; }
.link:hover { color: var(--ink); }
.link .ico { width: 12px; height: 12px; transition: transform 0.2s var(--out); }
.link:hover .ico { transform: translateX(2px); }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; color: var(--ink-2); background: rgba(255, 255, 255, 0.05); white-space: nowrap; }
.tag.pos { color: var(--pos); background: var(--pos-soft); } .tag.warn { color: var(--warn); background: var(--warn-soft); } .tag.acc { color: var(--accent); background: var(--accent-soft); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-4); flex: none; }

/* segmented control: sliding thumb, masked labels */
.seg { position: relative; display: inline-flex; padding: 2px; gap: 1px; border-radius: 9px; background: rgba(0, 0, 0, 0.25); box-shadow: inset 0 0 0 1px var(--line); isolation: isolate; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 7px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 3px rgba(0, 0, 0, 0.45); z-index: -1; transition: transform calc(220ms * var(--speed)) var(--out), width calc(220ms * var(--speed)) var(--out); }
.seg button { border: 0; background: transparent; height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; color: var(--ink-3); font-weight: 500; transition: color 0.2s; }
.seg button.active { color: var(--ink); }

/* ============================== layered tiles ============================== */
.hello { display: flex; align-items: flex-end; gap: 12px; margin: 30px 0 18px; }
.hello h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
.hello .dimmer { font-size: 12.5px; padding-bottom: 3px; }
.bento { margin-top: 30px; display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(170px, auto); gap: 14px; }
.tile {
  position: relative; border-radius: 28px; padding: 20px 22px; display: flex; flex-direction: column; min-width: 0;
  background: linear-gradient(180deg, #161619, var(--card) 58%);
  box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 1px 2px rgba(0, 0, 0, 0.5), 0 14px 34px -18px rgba(0, 0, 0, 0.85);
  transition: transform 0.25s var(--out), box-shadow 0.25s;
  animation: tile-in calc(560ms * var(--speed)) var(--out) both; animation-delay: calc(var(--i, 0) * 50ms * var(--speed));
}
.tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 0.3s; background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.055), transparent 60%); }
.tile:hover::before { opacity: 1; }
.tile:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 2px 4px rgba(0, 0, 0, 0.5), 0 20px 44px -20px rgba(0, 0, 0, 0.95); }
.tile.hero:hover { transform: none; }
@keyframes tile-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
.t-h { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 13px; color: var(--ink-2); font-weight: 500; position: relative; }
.t-v { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.15; margin-top: 10px; white-space: nowrap; }
.t-v small { font-size: 13px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; margin-left: 6px; }
.t-s { color: var(--ink-3); font-size: 12px; margin-top: 3px; }
.t-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); position: relative; }
.t-foot b { color: var(--ink-2); font-weight: 600; }
.t-foot b.pos { color: var(--pos); }
.s4 { grid-column: span 4; } .s8 { grid-column: span 8; }
.hero { grid-column: span 8; grid-row: span 2; padding: 22px 24px 18px; }
.amt { transition: filter calc(250ms * var(--speed)) var(--out); }
.private .amt { filter: blur(7px); }

/* hero: value, change, chart, the four facts as layered sub-tiles */
.hv { display: flex; align-items: flex-start; margin-top: 10px; white-space: nowrap; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
.hv .cur { font-size: 18px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.01em; margin: 6px 10px 0 0; }
.hv .int { font-size: 56px; } .hv .dec { font-size: 56px; color: var(--ink-4); }
.h-sub { display: flex; align-items: center; gap: 10px; height: 20px; margin-top: 10px; color: var(--ink-3); font-size: 12.5px; }
.h-sub .when { color: var(--ink-2); }
.delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.delta.pos::before { content: ""; border: 4px solid transparent; border-bottom: 5px solid currentColor; margin-bottom: 4px; }
.h-ctl { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--ink-3); position: relative; z-index: 1; }
.chart { position: relative; flex: 1; min-height: 220px; margin-top: 8px; user-select: none; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ax line { stroke: var(--line); } .ax text { fill: var(--ink-3); font: 11px var(--font); }
.n-line { fill: none; stroke: var(--accent); stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; }
.n-area { opacity: 1; }
.g-line, .g-layers { transition: opacity calc(320ms * var(--speed)) ease; }
.lay { stroke: rgba(0, 0, 0, 0.35); stroke-width: 0.75; }
.zero { stroke: var(--line-3); stroke-dasharray: 2 3; }
.cross { stroke: var(--line-3); } .c-dot { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.c-hover { transition: opacity 0.15s; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-3); min-height: 18px; transition: opacity calc(220ms * var(--speed)) ease; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: -0.5px; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; position: relative; }
.fact { padding: 12px 14px; border-radius: 16px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012)); box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255, 255, 255, 0.04); display: grid; gap: 2px; min-width: 0; transition: box-shadow 0.15s, transform 0.2s var(--out); }
.fact:hover { box-shadow: inset 0 0 0 1px var(--line-3), inset 0 1px 0 rgba(255, 255, 255, 0.06); transform: translateY(-1px); }
.fact .l { font-size: 12px; color: var(--ink-3); }
.fact .v { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; }
.fact .d { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* budget: three meters */
.meters { display: grid; gap: 12px; margin-top: 14px; }
.meter { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.meter b { font-weight: 650; color: var(--ink); white-space: nowrap; }
.track { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: inherit; width: 0; transition: width calc(900ms * var(--speed)) var(--out); transition-delay: calc((350ms + var(--k, 0) * 80ms) * var(--speed)); }
.in .track i { width: var(--w); }

/* surplus -> contribution: ring + the year's months */
.ring-row { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
.ring { width: 64px; height: 64px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .arc { stroke-dasharray: 163.4; stroke-dashoffset: 163.4; transition: stroke-dashoffset calc(1100ms * var(--speed)) var(--out); transition-delay: calc(400ms * var(--speed)); }
.in .ring .arc { stroke-dashoffset: var(--off); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12.5px; font-weight: 650; }
.months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 14px; }
.months i { height: 14px; border-radius: 4px; background: var(--surface-3); transition: background calc(300ms * var(--speed)); transition-delay: calc((550ms + var(--k) * 50ms) * var(--speed)); }
.in .months i.on { background: var(--ink-2); }
.months i.miss { box-shadow: inset 0 0 0 1px var(--warn); background: transparent; }
.months i.plan { box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.m-lab { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 4px; font-size: 9.5px; color: var(--ink-4); text-align: center; }

/* investments: spark + chances / risks */
.spark { height: 46px; margin-top: 12px; }
.spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.sp-l { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset calc(1200ms * var(--speed)) var(--out); transition-delay: calc(450ms * var(--speed)); }
.in .sp-l { stroke-dashoffset: 0; }
.sp-a { opacity: 0; transition: opacity calc(500ms * var(--speed)) ease calc(1100ms * var(--speed)); }
.in .sp-a { opacity: 1; }
.pills { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

/* list rows inside tiles: assets, loans, accounts */
.rows { margin-top: 10px; display: grid; position: relative; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .n { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .v { font-weight: 650; text-align: right; white-space: nowrap; }
.row .s { grid-column: 1; font-size: 11.5px; color: var(--ink-3); }
.row .s2 { font-size: 11.5px; color: var(--ink-3); text-align: right; white-space: nowrap; }
.row .bar { grid-column: 1 / -1; margin-top: 6px; }
.row .bar .track { height: 5px; }
.acc-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
.acc-grid .row:nth-child(2) { border-top: 0; }
.wallet { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: 16px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012)); box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px; color: var(--ink-2); position: relative; }
.wallet b { color: var(--ink); font-weight: 650; }
.subs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; position: relative; }
.next { display: grid; gap: 6px; margin-top: 12px; position: relative; }
.next div { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.next div b { margin-left: auto; color: var(--ink); font-weight: 600; }
.next .when { color: var(--ink-3); font-size: 11.5px; width: 46px; }

/* lab bar */
.labbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; display: flex; gap: 6px; padding: 6px; border-radius: 14px; background: rgba(22, 22, 25, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(14px); font: 12px -apple-system, sans-serif; }
.labbar button { border: 0; background: transparent; color: #a1a1a7; padding: 5px 10px; border-radius: 8px; display: inline-flex; gap: 7px; }
.labbar button:hover { color: #fff; }
.labbar kbd { font: 10px ui-monospace, Menlo, monospace; color: #6e6e74; }
</style>
</head>

<script>
/* ============================== data (synthetic) ============================== */
const fmt0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const minus = (s) => s.replace("-", "−");
const pln = (v) => minus(`${v < 0 ? "-" : ""}PLN ${fmt0.format(Math.abs(v))}`);
const k = (v) => `${fmt0.format(v / 1000)}k`;
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const LAYERS = [
  { key: "acc", name: "Accounts", color: "var(--c2)" },
  { key: "inv", name: "Investments", color: "var(--c1)" },
  { key: "car", name: "Car", color: "var(--c4)" },
  { key: "prop", name: "Property", color: "var(--c3)" },
];
const WEEKS = (() => {
  let a = 20261109;
  const rnd = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const out = [];
  let inv = 48000, acc = 38000;
  for (let w = 0; w <= 52; w++) {
    const t = w / 52, d = new Date(2025, 10, 9 + w * 7);
    inv = inv * (1 + 0.0042 + (rnd() - 0.5) * 0.03) + (d.getDate() <= 7 ? 2500 : 0);
    acc = Math.max(20000, acc + 170 + (rnd() - 0.5) * 2600);
    const prop = d < new Date(2026, 2, 3) ? 790000 : 820000;
    out.push({ d, acc, inv, prop, car: 70000 - 7700 * t, mort: 440000 - 27700 * t, loan: 26000 - 7100 * t });
  }
  // pin the last week to the hero's figures
  const last = out[52], fi = 61789.61 / last.inv, fa = 46812.4 / last.acc;
  return out.map((p, i) => ({ ...p, inv: p.inv * fi ** (i / 52), acc: p.acc * fa ** (i / 52) }));
})();
const net = (p) => p.acc + p.inv + p.prop + p.car - p.mort - p.loan;
const NOW = WEEKS[52], NET = net(NOW), MONTH_AGO = net(WEEKS[48]);

/* ============================== motion helpers ============================== */
let SPEED = new URLSearchParams(location.search).has("still") || matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1;
const easeOut = (t) => 1 - (1 - t) ** 4;
const easeInOut = (t) => (t < 0.5 ? 8 * t ** 4 : 1 - (-2 * t + 2) ** 4 / 2);
function tween(ms, fn, ease = easeOut) {
  const dur = ms * SPEED;
  if (dur <= 0) { fn(1); return { stop() {} }; }
  let raf, stopped = false;
  const t0 = performance.now();
  const step = (t) => { if (stopped) return; const q = Math.min(1, (t - t0) / dur); fn(ease(q)); if (q < 1) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
  return { stop() { stopped = true; cancelAnimationFrame(raf); } };
}

  chev: '<svg class="ico" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg>',
  plus: '<svg class="ico" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>',
};
const SEG = (key, items, active) => `<div class="seg" data-seg="${key}"><span class="thumb"></span>${items.map((t) => `<button class="${t === active ? "active" : ""}">${t}</button>`).join("")}</div>`;
const setHero = (root, v) => { const [a, b] = fmt2.format(v).split("."); root.querySelector("[data-int]").textContent = a; root.querySelector("[data-dec]").textContent = `.${b}`; };

/* ============================== the page ============================== */
function html() {
  const assets = NOW.acc + NOW.inv + NOW.prop + NOW.car, liab = NOW.mort + NOW.loan, d = NET - MONTH_AGO;

    const pts = WEEKS.map((p) => p.inv), lo = Math.min(...pts), hi = Math.max(...pts);
    const P = pts.map((v, i) => `${((i / 52) * 100).toFixed(2)},${(4 + (1 - (v - lo) / (hi - lo)) * 38).toFixed(2)}`);
    return { line: `M${P.join("L")}`, area: `M${P.join("L")}L100,46L0,46Z` };
  })();
  const months = MON.map((m, i) => `<i class="${i < 9 ? "on" : i === 9 ? "miss" : i === 10 ? "plan" : ""}" style="--k:${i}" title="${m}: ${i < 9 ? "booked PLN 2,500" : i === 9 ? "missed" : i === 10 ? "planned PLN 2,500 · Nov 10" : "ahead"}"></i>`).join("");

  <div class="bento">

      <div class="t-h">Net worth<span class="dimmer" style="font-weight:400">since Oct</span><div class="spacer"></div><span class="tag" title="not converted">other currencies: <span class="amt">€2,140</span></span></div>

      <div class="h-sub" data-sub></div>

        <div class="fact"><span class="l">Liabilities</span><span class="v neg amt">${pln(-liab)}</span><span class="d">2 loans</span></div>
        <div class="fact"><span class="l">Home equity</span><span class="v amt">${pln(NOW.prop - NOW.mort)}</span><span class="d">property - mortgage</span></div>
        <div class="fact"><span class="l">Liquid</span><span class="v amt">${pln(NOW.acc)}</span><span class="d">4.1 mo. of spending</span></div>
      </div>
    </section>

        <div class="meter"><span>Surplus</span><div class="track"><i style="--w:29.5%;--k:2;background:var(--accent)"></i></div><b class="amt">PLN 4,780</b></div>
      </div>

/* ============================== the hero chart ============================== */
function heroChart(root) {
  const el = root.querySelector("[data-chart]"), svg = el.querySelector("svg"), sub = root.querySelector("[data-sub]"), legend = root.querySelector("[data-legend]");
  const st = { scope: "Total", type: "Line" };
  let W = 0, H = 0, dom = [0, 1], anim = null, ready = false;
  const pad = { t: 8, r: 44, b: 22, l: 0 };
  const N = WEEKS.length;
  const X = (i) => pad.l + (i / (N - 1)) * (W - pad.l - pad.r);
  const Y = (v, d = dom) => pad.t + (1 - (v - d[0]) / (d[1] - d[0])) * (H - pad.t - pad.b);
  const series = (s) => WEEKS.map((p) => (s.scope === "Total" ? net(p) : p.acc));
  const stacks = (s) => {
    const keys = s.scope === "Total" ? LAYERS : LAYERS.filter((l) => l.key === "acc");
    let base = WEEKS.map(() => 0);
    const up = keys.map((l) => { const lo = base, hi = base.map((b, i) => b + WEEKS[i][l.key]); base = hi; return { ...l, lo, hi }; });
    const debt = s.scope === "Total" ? WEEKS.map((p) => -(p.mort + p.loan)) : null;
    return { up, debt };
  };
  const domainOf = (s) => {
    if (s.type === "Line") { const v = series(s), lo = Math.min(...v), hi = Math.max(...v), sp = hi - lo || 1; return [lo - sp * 0.1, hi + sp * 0.08]; }
    const z = stacks(s), hi = Math.max(...z.up[z.up.length - 1].hi), lo = z.debt ? Math.min(...z.debt) : 0;
    return [lo * 1.06, hi * 1.04];
  };
  const band = (lo, hi, d) => `M${hi.map((v, i) => `${X(i).toFixed(1)},${Y(v, d).toFixed(1)}`).join("L")}L${lo.map((v, i) => `${X(N - 1 - i).toFixed(1)},${Y(lo[N - 1 - i], d).toFixed(1)}`).join("L")}Z`;
  const ticks = (d) => { const span = d[1] - d[0], mag = 10 ** Math.floor(Math.log10(span / 3)); const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).reduce((b, s) => (Math.abs(span / s - 3) < Math.abs(span / b - 3) ? s : b)); const t = []; for (let v = Math.ceil(d[0] / step) * step; v <= d[1]; v += step) t.push(Math.abs(v) < 1e-6 ? 0 : v); return t; };
  function draw(d, alpha = { line: st.type === "Line" ? 1 : 0, layers: st.type === "Layers" ? 1 : 0 }) {
    const v = series(st), z = stacks(st);
    const lp = v.map((x, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(x, d).toFixed(1)}`).join("");
    svg.innerHTML = `<defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ea4ff" stop-opacity=".2"/><stop offset="1" stop-color="#8ea4ff" stop-opacity="0"/></linearGradient><clipPath id="nclip"><rect x="-10" y="-10" height="2000" width="${clipW}"/></clipPath></defs>
      <g class="ax">${ticks(d).map((t) => `<line x1="0" x2="${W - pad.r + 6}" y1="${Y(t, d)}" y2="${Y(t, d)}"/><text x="${W}" y="${Y(t, d) + 4}" text-anchor="end">${k(t)}</text>`).join("")}
        ${[0, 13, 26, 39, 52].map((i, j) => `<text x="${X(i)}" y="${H - 4}" text-anchor="${j === 0 ? "start" : j === 4 ? "end" : "middle"}">${MON[WEEKS[i].d.getMonth()]} ${String(WEEKS[i].d.getFullYear()).slice(2)}</text>`).join("")}</g>
      <g clip-path="url(#nclip)">
        <g class="g-layers" style="opacity:${alpha.layers}">${z.up.map((l) => `<path class="lay" d="${band(l.lo, l.hi, d)}" fill="${l.color}" fill-opacity=".55"/>`).join("")}${z.debt ? `<path class="lay" d="${band(WEEKS.map(() => 0), z.debt, d)}" fill="var(--neg)" fill-opacity=".35"/>` : ""}${d[0] < 0 ? `<line class="zero" x1="0" x2="${W - pad.r}" y1="${Y(0, d)}" y2="${Y(0, d)}"/>` : ""}</g>
        <g class="g-line" style="opacity:${alpha.line}"><path d="${lp}L${X(N - 1)},${H - pad.b}L${X(0)},${H - pad.b}Z" fill="url(#ng)"/></g>
        <path class="n-line" d="${lp}"/>
      </g>
      <g class="c-hover" opacity="0"><line class="cross"/><circle class="c-dot" r="4"/></g>
      <rect class="hit" fill="transparent" x="0" y="0" width="${W - pad.r}" height="${H}"/>`;
    bindHit();
  }
  let clipW = 0;
  const showSub = (i) => {
    if (i == null) { const dd = NET - MONTH_AGO; sub.innerHTML = `<span class="delta pos amt">${pln(dd).replace("PLN", "+PLN")} (${((dd / MONTH_AGO) * 100).toFixed(1)}%)</span><span>since Oct 9</span>`; return; }
    const p = WEEKS[i];
    sub.innerHTML = `<span class="when">${MON[p.d.getMonth()]} ${p.d.getDate()}, ${p.d.getFullYear()}</span><span class="amt">assets ${pln(p.acc + p.inv + p.prop + p.car)} · liabilities ${pln(-(p.mort + p.loan))}</span>`;
  };
  function bindHit() {
    const hit = svg.querySelector(".hit"), hov = svg.querySelector(".c-hover"), cross = svg.querySelector(".cross"), dot = svg.querySelector(".c-dot");
    hit.addEventListener("pointermove", (e) => {
      if (!ready) return;
      const b = svg.getBoundingClientRect(), i = Math.max(0, Math.min(N - 1, Math.round(((e.clientX - b.left) / (W - pad.r)) * (N - 1)))), v = series(st)[i];
      hov.setAttribute("opacity", 1);
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("y1", pad.t); cross.setAttribute("y2", H - pad.b);
      dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(v));
      setHero(root, v); showSub(i);
    });
    hit.addEventListener("pointerleave", () => { hov.setAttribute("opacity", 0); setHero(root, series(st)[N - 1]); showSub(null); });
  }
  const drawLegend = () => {
    const z = stacks(st);
    legend.style.opacity = st.type === "Layers" ? 1 : 0;
    legend.innerHTML = [...z.up].reverse().map((l) => `<span><i style="background:${l.color}"></i>${l.name}</span>`).join("") + (z.debt ? `<span><i style="background:var(--neg)"></i>Loans</span>` : "");
  };
  function measure() { W = el.clientWidth; H = el.clientHeight; svg.setAttribute("viewBox", `0 0 ${W} ${H}`); }
  function intro() {
    measure(); dom = domainOf(st); drawLegend(); showSub(null);
    const v = series(st);
    anim = tween(1300, (q) => { clipW = X(Math.round(q * (N - 1))) + 4; draw(dom); setHero(root, v[Math.round(q * (N - 1))]); if (q === 1) { clipW = W + 20; draw(dom); ready = true; } }, easeInOut);
  }
  function change(next) {
    anim?.stop(); clipW = W + 20; ready = true;
    const d0 = dom, wasLine = st.type === "Line";
    Object.assign(st, next);
    const d1 = domainOf(st), toLine = st.type === "Line";
    drawLegend(); setHero(root, series(st)[N - 1]);
    anim = tween(450, (q) => {
      const d = [d0[0] + (d1[0] - d0[0]) * q, d0[1] + (d1[1] - d0[1]) * q];
      const a = wasLine === toLine ? { line: toLine ? 1 : 0, layers: toLine ? 0 : 1 } : { line: toLine ? q : 1 - q, layers: toLine ? 1 - q : q };
      draw(d, a);
      if (q === 1) dom = d1;
    }, easeInOut);
  }
  intro();
  return { change, stop: () => anim?.stop(), resize() { measure(); clipW = W + 20; draw(dom); } };
}

/* ============================== mount ============================== */
let chart = null;
function placeThumb(seg, instant) {
  const b = seg.querySelector("button.active"), th = seg.querySelector(".thumb");
  if (instant) th.style.transition = "none";
  th.style.width = `${b.offsetWidth}px`; th.style.transform = `translateX(${b.offsetLeft}px)`;
  if (instant) setTimeout(() => (th.style.transition = ""), 32);
}
function mount() {
  chart?.stop();
  const root = document.getElementById("root");
  root.innerHTML = html();
  const page = root.firstElementChild;
  chart = heroChart(page);
  for (const seg of page.querySelectorAll(".seg")) {
    placeThumb(seg, true);
    seg.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b || b.classList.contains("active")) return;
      for (const o of seg.querySelectorAll("button")) o.classList.toggle("active", o === b);
      placeThumb(seg);
      chart.change({ [seg.dataset.seg]: b.textContent });
    });
  }
  // the cursor's spotlight on every tile
  for (const t of page.querySelectorAll(".tile")) t.addEventListener("pointermove", (e) => { const r = t.getBoundingClientRect(); t.style.setProperty("--mx", `${e.clientX - r.left}px`); t.style.setProperty("--my", `${e.clientY - r.top}px`); });
  void page.offsetWidth;
  setTimeout(() => page.classList.add("in"), 16);
}
const MOTION = [["Motion", 1], ["Slow ×4", 4], ["Motion off", 0]];
function setSpeed(s) { SPEED = s; document.documentElement.style.setProperty("--speed", s); document.getElementById("speedBtn").innerHTML = `<kbd>M</kbd>${MOTION.find((m) => m[1] === s)[0]}`; }
document.querySelector(".labbar").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.act === "replay") mount(); else { const i = MOTION.findIndex((m) => m[1] === SPEED); setSpeed(MOTION[(i + 1) % 3][1]); } });
document.addEventListener("keydown", (e) => { if (e.metaKey || e.ctrlKey) return; if (e.key.toLowerCase() === "r") mount(); if (e.key.toLowerCase() === "m") { const i = MOTION.findIndex((m) => m[1] === SPEED); setSpeed(MOTION[(i + 1) % 3][1]); } });
document.getElementById("privacy").addEventListener("click", () => document.documentElement.classList.toggle("private"));
addEventListener("resize", () => { chart?.resize(); for (const s of document.querySelectorAll(".seg")) placeThumb(s, true); });
setSpeed(SPEED);
mount();
document.fonts?.ready.then(() => { for (const s of document.querySelectorAll(".seg")) placeThumb(s, true); });
</script>
