<!doctype html>
<!--
  cashU investments home, top of the screen: five holistic variants (panel craft, layout and motion together),
  V5 "Final draft" is the current direction. Locked: colors = Neutral, UI font = Geist (numbers too), mono = Geist Mono.
  Data: synthetic.
  Controls (bottom bar): 1-5 variant, R replays the entrance, M cycles motion (normal / slow x4 / off).
  URL: the hash keeps the variant; ?still renders final states (no motion); ?card=TICKER pins a V5 tile card open.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cashU investments lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* ============================== locked tokens ============================== */
:root {
  color-scheme: dark;
  --bg: #0a0a0b;
  --surface: #111113;
  --surface-2: #17171a;
  --surface-3: #1e1e22;
  --line: rgba(255, 255, 255, 0.065);
  --line-2: rgba(255, 255, 255, 0.11);
  --line-3: rgba(255, 255, 255, 0.18);
  --ink: #ededf0;
  --ink-2: #a3a3ab;
  --ink-3: #6e6e77;
  --ink-4: #4a4a52;
  --accent: #8ea4ff;
  --accent-soft: rgba(142, 164, 255, 0.13);
  --pos: #4cc38a;
  --pos-soft: rgba(76, 195, 138, 0.12);
  --neg: #ef6f6c;
  --neg-soft: rgba(239, 111, 108, 0.12);
  --warn: #e5a54a;
  --warn-soft: rgba(229, 165, 74, 0.12);
  --c1: #8ea4ff; --c2: #5cc0d6; --c3: #b39cff; --c4: #e5a54a; --c5: #5d5d66;
  --font: "Geist", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  /* motion */
  --speed: 1;
  --out: cubic-bezier(0.16, 1, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.36, 0.64, 1);
}

/* ============================== base and primitives ============================== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
b { font-weight: 600; }
.spacer { flex: 1; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); }
.dim { color: var(--ink-2); } .dimmer { color: var(--ink-3); }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { max-width: 1200px; margin: 0 auto; padding: 0 28px 140px; }

.topbar { display: flex; align-items: center; gap: 20px; height: 56px; border-bottom: 1px solid var(--line); }
.topbar .brand img { height: 22px; display: block; }
.nav { display: flex; gap: 2px; height: 100%; }
.nav a { display: flex; align-items: center; padding: 0 10px; color: var(--ink-3); font-size: 13px; cursor: pointer; position: relative; transition: color 0.15s; }
.nav a:hover, .nav a.active { color: var(--ink); }
.nav a.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 1.5px; background: var(--ink); border-radius: 2px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); }
.profile { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 8px 4px 4px; border-radius: 999px; color: var(--ink-2); transition: background 0.15s, color 0.15s; }
.profile:hover { background: var(--surface-2); color: var(--ink); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px;
  border-radius: 8px; border: 0; background: var(--surface-3); color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background 0.15s, transform 0.12s var(--out);
}
.btn:hover { background: #26262b; }
.btn:active { transform: scale(0.97); }
.btn .ico { width: 14px; height: 14px; color: var(--ink-2); }
.btn.primary { background: var(--ink); color: #0b0b0c; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.15); font-weight: 600; }
.btn.primary:hover { background: #fff; }
.btn.primary .ico { color: #0b0b0c; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn .arrow { transition: transform 0.2s var(--out); }
.btn:hover .arrow { transform: translateX(2px); }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 650; background: rgba(0, 0, 0, 0.13); }
.icon-btn { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); transition: background 0.15s, color 0.15s, transform 0.12s; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn:active { transform: scale(0.92); }
.icon-btn .ico { width: 15px; height: 15px; }

/* segmented control with a sliding thumb */
.seg { position: relative; display: inline-flex; padding: 2px; gap: 1px; border-radius: 8px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); isolation: isolate; }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 6px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 3px rgba(0, 0, 0, 0.45); z-index: -1; transition: transform calc(220ms * var(--speed)) var(--out), width calc(220ms * var(--speed)) var(--out); }
/* masked labels: the active colour exists only where the thumb is, so it changes exactly under it */
.seg .seg-hi { position: absolute; inset: 0; padding: 2px; display: flex; gap: 1px; pointer-events: none; transition: clip-path calc(220ms * var(--speed)) var(--out); }
.seg .seg-hi span { height: 24px; padding: 0 9px; font-size: 12px; font-weight: 500; color: var(--ink); display: grid; place-items: center; white-space: nowrap; }
.seg.mask button, .seg.mask button.active, .seg.mask button:hover { color: var(--ink-3); }
.seg button { border: 0; background: transparent; height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; color: var(--ink-3); font-weight: 500; transition: color 0.2s; }
.seg button:hover { color: var(--ink-2); }
.seg button.active { color: var(--ink); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
.status.warn::before { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.status.pos::before { background: var(--pos); box-shadow: 0 0 0 3px var(--pos-soft); }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; }
.delta.neg::before { content: ""; border: 4px solid transparent; border-top: 5px solid currentColor; margin-top: 4px; }
.ticker { font: 600 10px/1 var(--mono); letter-spacing: 0.02em; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); border-radius: 6px; padding: 0 6px; height: 24px; display: inline-grid; place-items: center; flex: none; }
.link { color: var(--ink-2); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; transition: color 0.15s; }
.link:hover { color: var(--ink); }
.link .ico { width: 12px; height: 12px; transition: transform 0.2s var(--out); }
.link:hover .ico { transform: translateX(2px); }
.bar { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--ink); }
.hero-num { white-space: nowrap; font-weight: 500; letter-spacing: -0.03em; }
.hero-num .cur { font-size: 0.32em; letter-spacing: 0.02em; color: var(--ink-3); font-weight: 500; vertical-align: 1.9em; margin-right: 0.45em; }
.hero-num .dec { color: var(--ink-4); }

/* entrance and growth: replayed by re-mounting; durations scale with --speed */
.enter { animation: enter calc(560ms * var(--speed)) var(--out) both; animation-delay: calc(var(--i, 0) * 60ms * var(--speed)); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
.grow { width: 0; transition: width calc(900ms * var(--speed)) var(--out); transition-delay: calc((300ms + var(--i, 0) * 70ms) * var(--speed)); }
.in .grow { width: var(--w); }
.fade-late { opacity: 0; transition: opacity calc(500ms * var(--speed)) ease; transition-delay: calc(1500ms * var(--speed)); }
.in .fade-late { opacity: 1; }

/* chart */
.chart { position: relative; user-select: none; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; touch-action: none; }
.c-ax line { stroke: var(--line); }
.c-ax text { fill: var(--ink-3); font: 11px var(--font); font-variant-numeric: tabular-nums; }
.c-ax { transition: opacity calc(350ms * var(--speed)) ease; }
.c-line { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
.c-bench { fill: none; stroke: var(--ink-3); stroke-width: 1.25; stroke-dasharray: 3 3; }
.c-stop-a { stop-color: var(--accent); stop-opacity: 0.22; }
.c-stop-b { stop-color: var(--accent); stop-opacity: 0; }
.c-end { fill: var(--accent); stroke: var(--bg); stroke-width: 2; transition: opacity 0.2s; }
.c-end.b { fill: var(--ink-3); }
.c-lead { fill: #fff; filter: drop-shadow(0 0 6px var(--accent)) drop-shadow(0 0 14px var(--accent)); }
.c-cross { stroke: var(--line-3); }
.c-dot { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.c-dot.b { fill: var(--ink-3); }
.c-hover { transition: opacity 0.15s; }
.chart.scrubbing .c-end { opacity: 0; }

/* ============================== V1 · Quiet ============================== */
.V1 .head { display: flex; align-items: flex-end; gap: 8px; margin: 28px 0 18px; }
.V1 h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.V1 .meta { display: flex; gap: 14px; margin-top: 8px; color: var(--ink-3); font-size: 12px; }
.V1 .panel { background: var(--surface); border-radius: 12px; padding: 16px; box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 0.2s; }
.V1 .panel:hover { box-shadow: inset 0 0 0 1px var(--line-2); }
.V1 .p-head { display: flex; align-items: center; gap: 8px; min-height: 28px; margin-bottom: 10px; }
.V1 .p-title { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
.V1 .p-count { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.V1 .p-sub { color: var(--ink-3); font-size: 12px; margin-left: 2px; }
.V1 .p-foot { display: flex; align-items: center; gap: 18px; margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 12px; }
.V1 .p-foot b { color: var(--ink); }
.V1 .lead { margin: 0; font-size: 14px; font-weight: 500; line-height: 1.4; }
.V1 .lead.quiet { color: var(--ink-2); font-weight: 400; }
.V1 .kpis { display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); padding: 0; }
.V1 .kpi { padding: 18px 20px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.V1 .kpi:first-child { border-left: 0; }
.V1 .k-label { color: var(--ink-3); font-size: 12px; }
.V1 .k-value { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; white-space: nowrap; }
.V1 .k-value small { font-size: 12px; color: var(--ink-3); font-weight: 400; letter-spacing: 0; margin-left: 4px; }
.V1 .k-sub { color: var(--ink-3); font-size: 12px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.V1 .k-hero { font-size: 34px; line-height: 1.1; }
.V1 .kpi .bar { margin: 4px 0 1px; max-width: 180px; }
.V1 .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; margin-top: 14px; align-items: start; }
.V1 .col { display: grid; gap: 14px; }
.V1 .readout { display: flex; align-items: center; gap: 18px; height: 22px; font-size: 12px; color: var(--ink-3); margin-bottom: 8px; }
.V1 .readout .k { display: inline-flex; align-items: center; gap: 7px; }
.V1 .readout .k b { color: var(--ink); font-weight: 550; }
.V1 .readout .date { color: var(--ink-2); min-width: 96px; }
.sw-l { width: 12px; border-top: 2px solid var(--accent); border-radius: 2px; }
.sw-l.b { border-top: 1.5px dashed var(--ink-3); }
.V1 .chart { height: 248px; }
.V1 .stats { display: flex; gap: 20px; }
.V1 .stats span b { margin-left: 5px; }
.V1 table.alloc { width: 100%; border-collapse: collapse; }
.V1 .alloc th { font-size: 11.5px; font-weight: 450; color: var(--ink-3); text-align: right; padding: 0 10px 8px; }
.V1 .alloc :is(th, td):first-child { text-align: left; padding-left: 0; }
.V1 .alloc :is(th, td):last-child { padding-right: 0; }
.V1 .alloc th.l { text-align: left; }
.V1 .alloc td { padding: 0 10px; height: 36px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; transition: background 0.15s; }
.V1 .alloc tbody tr:hover td { background: var(--surface-2); }
.V1 .name { display: flex; align-items: center; gap: 10px; }
.V1 .swb { width: 8px; height: 8px; border-radius: 2px; }
.V1 .track-c { width: 34%; }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-3); }
.track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; transition: filter 0.2s, width calc(900ms * var(--speed)) var(--out); transition-delay: 0s, calc((300ms + var(--i, 0) * 70ms) * var(--speed)); }
.track > b { position: absolute; top: -4px; width: 2px; height: 14px; border-radius: 1px; background: var(--ink); transform: translateX(-1px); }
tr:hover .track > i { filter: brightness(1.25); }
.priority { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; }
.priority .ico { width: 15px; height: 15px; margin-top: 1px; color: var(--accent); }
.priority b { color: var(--ink); }
.V1 .task { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 0.2s; cursor: pointer; }
.V1 .task:hover { box-shadow: inset 0 0 0 1px var(--line-3); }
.V1 .task-ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.V1 .task-body { display: grid; gap: 1px; flex: 1; min-width: 0; }
.V1 .task-body span, .V1 .cand-body span { color: var(--ink-3); font-size: 12px; }
.V1 .watch { display: flex; gap: 6px; margin-top: 12px; }
.V1 .watch i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-3); }
.V1 .cand { display: flex; align-items: flex-start; gap: 12px; margin-top: 12px; }
.V1 .cand-body { display: grid; gap: 2px; flex: 1; min-width: 0; }
.V1 .cand-actions { display: flex; gap: 2px; opacity: 0; transform: translateX(4px); transition: opacity 0.2s, transform 0.2s var(--out); }
.V1 .panel:hover .cand-actions { opacity: 1; transform: none; }

/* ============================== V2 · Statement ============================== */
.V2 .hero { padding-top: 34px; }
.V2 .hero-top { display: flex; align-items: flex-start; gap: 8px; }
.V2 .eyebrow { display: flex; align-items: center; gap: 14px; color: var(--ink-3); font-size: 12.5px; }
.V2 .eyebrow b { color: var(--ink-2); font-weight: 500; }
.V2 .big { font-size: 64px; line-height: 1; margin: 14px 0 10px; letter-spacing: -0.045em; font-weight: 450; }
.V2 .sub { display: flex; align-items: center; gap: 10px; height: 20px; color: var(--ink-3); font-size: 13px; }
.V2 .sub .when { color: var(--ink-2); }
.V2 .chart-bar { display: flex; align-items: center; gap: 18px; margin: 26px 0 8px; font-size: 12px; color: var(--ink-3); }
.V2 .k { display: inline-flex; align-items: center; gap: 7px; }
.V2 .chart { height: 300px; }
.V2 .ledger { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 22px; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); }
.V2 .cell { padding: 16px 0 18px 18px; border-left: 1px solid var(--line); display: grid; gap: 4px; align-content: start; }
.V2 .cell:first-child { border-left: 0; padding-left: 0; }
.V2 .cell .l { font-size: 12px; color: var(--ink-3); }
.V2 .cell .v { font-size: 22px; font-weight: 450; letter-spacing: -0.025em; }
.V2 .cell .s { font-size: 12px; color: var(--ink-3); }
.V2 .cell .bar { margin-top: 4px; max-width: 150px; height: 3px; }
.V2 .cols { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 56px; margin-top: 44px; }
.V2 .block-h { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.V2 h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.V2 .b-row { display: grid; grid-template-columns: 150px 1fr 60px 70px 92px 92px; align-items: center; gap: 14px; height: 46px; border-bottom: 1px solid var(--line); transition: background 0.15s; }
.V2 .b-row:hover { background: linear-gradient(90deg, transparent, var(--surface) 8%, var(--surface) 92%, transparent); }
.V2 .b-row.h { height: 34px; font-size: 11.5px; color: var(--ink-3); }
.V2 .r { text-align: right; white-space: nowrap; }
.V2 .b-name { display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.V2 .b-name i { width: 3px; height: 16px; border-radius: 2px; }
.bullet { position: relative; height: 18px; }
.bullet::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: var(--surface-3); border-radius: 1px; }
.bullet > i { position: absolute; left: 0; top: 5px; height: 8px; border-radius: 2px; }
.bullet > b { position: absolute; top: 1px; width: 2px; height: 16px; background: var(--ink); border-radius: 1px; }
.bullet > b::after { content: attr(data-t); position: absolute; top: -15px; left: 50%; transform: translate(-50%, 3px); font-size: 10px; color: var(--ink-2); font-weight: 500; opacity: 0; transition: opacity 0.15s, transform 0.2s var(--out); white-space: nowrap; }
.V2 .b-row:hover .bullet > b::after { opacity: 1; transform: translate(-50%, 0); }
.V2 .note { margin-top: 16px; color: var(--ink-2); font-size: 13px; line-height: 1.5; padding-left: 14px; border-left: 2px solid var(--accent); }
.V2 .note b { color: var(--ink); }
.V2 .q { list-style: none; margin: 0; padding: 0; }
.V2 .q li { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.V2 .q-ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); transition: color 0.15s, box-shadow 0.15s; }
.V2 .q li:hover .q-ico { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-3); }
.V2 .q-ico .ico { width: 15px; height: 15px; }
.V2 .q-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.V2 .q-t { font-size: 13.5px; font-weight: 500; }
.V2 .q-s { font-size: 12.5px; color: var(--ink-3); }
.V2 .q-go { color: var(--ink-4); align-self: center; transition: transform 0.2s var(--out), color 0.15s; }
.V2 .q li:hover .q-go { transform: translateX(3px); color: var(--ink-2); }
.V2 .q li.lead { padding: 16px; margin: 14px 0 6px; border: 0; border-radius: 12px; background: linear-gradient(180deg, var(--surface-2), var(--surface)); box-shadow: inset 0 0 0 1px var(--line-2); }
.V2 .q li.lead .q-ico { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.V2 .q li.lead .btn { align-self: center; }
.V2 .q li.quiet .q-t { color: var(--ink-2); font-weight: 450; }

/* ============================== V3 · Layered tiles ============================== */
.V3 .head { display: flex; align-items: center; gap: 14px; margin: 26px 0 16px; }
.V3 h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.V3 .bento { display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: minmax(150px, auto); gap: 12px; }
.V3 .tile {
  position: relative; border-radius: 16px; padding: 16px 18px; overflow: hidden; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #161619, var(--surface) 55%);
  box-shadow: inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 1px 2px rgba(0, 0, 0, 0.5), 0 12px 30px -16px rgba(0, 0, 0, 0.8);
  transition: transform 0.25s var(--out), box-shadow 0.25s;
}
.V3 .tile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity 0.3s; background: radial-gradient(320px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.06), transparent 60%); }

/* ============================== V4 · Quiet refined ==============================

   faint lit top edge, no drop shadows, headers quieter than the data, 20px padding, inner radius 8 inside
   a 14 card, monochrome data with one accent (the priority bucket), hover = the edge brightens, nothing moves.
   Motion (the 20 rules): ease-out entrances, 40ms panel / 30ms row stagger, no bounce, press 0.97,
   popover from its trigger at 0.95 (200ms in, 160ms out), crossfaded axes, masked segment labels,
   icon crossfade with blur, one pulse to confirm. */
.V4 { --card: #0e0e10; --g1: #a1a1aa; --g2: #71717a; --g4: #52525b; --g5: #3f3f46; }

/* ============================== V5 · Final draft ==============================
   Built on V4 (the root carries both classes, V5 rules override). No page header: the value is the hero
   (Statement size), Import and the weekly review on its right. The main column is the app's: chart (KPIs
   under it, inside the card), allocation (today's donut + rows, fixed), assets; the rail sits beside it.
   Assets keep the ticker tile and its marks (ring = thesis, coin = recommendation); the rest of the
   instrument's context, the strategy hint included, lives in the tile's hover card. */
.V5 .enter { animation-delay: calc(var(--i, 0) * 50ms * var(--speed)); }

.V5 .kc .v { font-size: 19px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; white-space: nowrap; }

.V5 :is(.al, .as-row):not(.h)::before { content: ""; position: absolute; inset: 0 -20px; background: rgba(255, 255, 255, 0.025); opacity: 0; transition: opacity 0.15s; pointer-events: none; }

@keyframes sp-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

<body>
<div class="designed-by" style="position:fixed;left:12px;bottom:12px;z-index:9999;pointer-events:none;font:600 10px/1 system-ui,-apple-system,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#8e8e94;background:rgba(22,22,25,.9);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px 10px;">designed by <span style="color:#8ea4ff;">jakob</span></div>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <div id="root"></div>
</div>
<div class="labnote" id="labnote"></div>
<div class="labbar" id="labbar"></div>

<script>
/* ============================== data (synthetic) ============================== */
const fmt0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const minus = (s) => s.replace("-", "−");
const pln = (v) => minus(`${v < 0 ? "-" : ""}PLN ${fmt0.format(Math.abs(v))}`);
const pct = (v) => minus(`${v > 0 ? "+" : ""}${v.toFixed(1)}%`);
const pp = (v) => minus(`${v > 0 ? "+" : ""}${v.toFixed(1)} pp`);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dateLong = (d) => `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
const SERIES = (() => {
  let a = 20261028;
  const rnd = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());
  const days = [];
  for (const d = new Date(2026, 9, 28); days.length < 800; d.setDate(d.getDate() - 1)) if (d.getDay() % 6) days.unshift(new Date(d));
  const contribution = (dt) => (dt.getFullYear() === 2026 ? (dt.getMonth() === 9 ? 0 : 2500) : dt.getFullYear() === 2025 ? 1250 : 800);
  let p = 3000, b = 3000, ip = 100, month = -1;
  const raw = days.map((dt) => {
    if (dt.getMonth() !== month) { month = dt.getMonth(); p += contribution(dt); b += contribution(dt); }
    const common = gauss(), stress = dt.getFullYear() === 2025 && dt.getMonth() === 3 && dt.getDate() < 12 ? -0.006 : 0;
    const rp = 0.00022 + stress + 0.0058 * (0.88 * common + 0.47 * gauss());
    p *= 1 + rp; ip *= 1 + rp; b *= 1 + 0.00032 + stress + 0.0064 * common;
    return { d: dt, p, b, ip };
  });
  const n = raw.length - 1, fp = 61789.61 / raw[n].p, fb = 64874 / raw[n].b;
  return raw.map((r, i) => ({ d: r.d, p: r.p * fp ** (i / n), b: r.b * fb ** (i / n), ip: r.ip }));
})();
const RANGES = { "1M": 21, "3M": 63, YTD: "ytd", "1Y": 252, "3Y": 756, Max: Infinity };
const slice = (range) => {
  const r = RANGES[range];
  if (r === "ytd") return SERIES.slice(SERIES.findIndex((s) => s.d.getFullYear() === 2026));
  return SERIES.slice(Number.isFinite(r) ? Math.max(0, SERIES.length - r) : 0);
};
const BUCKETS = [
  { name: "Global equities", now: 61.0, target: 65, value: 37664, to: 2499 },
  { name: "Bond ETFs", now: 13.2, target: 15, value: 8133, to: 1136 },
  { name: "Treasury bonds", now: 0.0, target: 5, value: 0, to: 3089 },
  { name: "Equities", now: 5.0, target: 10, value: 3114, to: 3065 },
  { name: "Cash", now: 20.8, target: 5, value: 12879, to: -9789 },
];
const weekly = (arr) => arr.filter((_, i) => i % 5 === 0 || i === arr.length - 1);
const YTD = weekly((() => { const s = SERIES.filter((x) => x.d.getFullYear() === 2026); return s.map((x) => (x.ip / s[0].ip - 1) * 100); })());
const DD = weekly((() => { let peak = -Infinity; return SERIES.slice(-252).map((x) => { peak = Math.max(peak, x.ip); return (x.ip / peak - 1) * 100; }); })());

/* ============================== motion helpers ============================== */
let SPEED = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 1;
if (new URLSearchParams(location.search).has("still")) SPEED = 0; // ?still: final states, for screenshots
const easeOut = (t) => 1 - (1 - t) ** 4;
const easeInOut = (t) => (t < 0.5 ? 8 * t ** 4 : 1 - (-2 * t + 2) ** 4 / 2);
function tween(ms, fn, ease = easeOut) {
  const dur = ms * SPEED;
  if (dur <= 0) { fn(1); return { stop() {} }; }
  let raf, stopped = false;
  const t0 = performance.now();
  const step = (t) => {
    if (stopped) return;
    const k = Math.min(1, (t - t0) / dur);
    fn(ease(k));
    if (k < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return { stop() { stopped = true; cancelAnimationFrame(raf); } };
}
function countUp(el, to, { from = 0, ms = 1000, fmt = (v) => fmt0.format(Math.round(v)), delay = 0 } = {}) {
  el.textContent = fmt(SPEED ? from : to);
  setTimeout(() => tween(ms, (k) => (el.textContent = fmt(from + (to - from) * k))), delay * SPEED);
}

/* ============================== chart engine ============================== */
// Every range is resampled to N points, so a range switch morphs point by point.
const N = 200;
function sample(range) {
  const s = slice(range);
  const p = [], b = [], d = [];
  for (let i = 0; i < N; i++) {
    const f = (i / (N - 1)) * (s.length - 1), lo = Math.floor(f), hi = Math.min(s.length - 1, lo + 1), t = f - lo;
    p.push(s[lo].p + (s[hi].p - s[lo].p) * t); b.push(s[lo].b + (s[hi].b - s[lo].b) * t); d.push(s[t < 0.5 ? lo : hi].d);
  }
  return { p, b, d, long: s.length > 140 };
}
function niceTicks(min, max, count) {
  const span = max - min, mag = 10 ** Math.floor(Math.log10(span / count));
  const step = [1, 2, 2.5, 5, 10, 20].map((m) => m * mag).reduce((best, s) => (Math.abs(span / s - count) < Math.abs(span / best - count) ? s : best));
  const t = [];
  for (let v = Math.ceil(min / step) * step; v <= max; v += step) t.push(Math.abs(v) < 1e-9 ? 0 : v);
  return t;
}
const domain = (s) => { const lo = Math.min(...s.p, ...s.b), hi = Math.max(...s.p, ...s.b), sp = hi - lo || 1; return [lo - sp * 0.08, hi + sp * 0.06]; };

// cfg: yAxis "left" | "right", intro "draw" | "wipe" | "rise", introMs, onScrub(point | null), onIntro(k, value)
function Chart(el, cfg) {
  const svg = el.querySelector("svg");
  const uid = Math.random().toString(36).slice(2, 7);
  svg.innerHTML = `<defs><linearGradient id="g${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="c-stop-a"/><stop offset="1" class="c-stop-b"/></linearGradient>
      <clipPath id="k${uid}"><rect x="-20" y="-20" height="2000" width="0"/></clipPath></defs>
    <g class="c-axes"></g>
    <g clip-path="url(#k${uid})"><path class="c-area" fill="url(#g${uid})"/><path class="c-bench"/><path class="c-line"/></g>
    <circle class="c-end b" r="2.5"/><circle class="c-end p" r="3.5"/><circle class="c-lead" r="3" opacity="0"/>
    <g class="c-hover" opacity="0"><line class="c-cross"/><circle class="c-dot b" r="3"/><circle class="c-dot p" r="4"/></g>
    <rect class="c-hit" fill="transparent"/>`;
  const $ = (s) => svg.querySelector(s);
  const clip = svg.querySelector("clipPath rect"), area = $(".c-area"), line = $(".c-line"), bench = $(".c-bench");
  const endP = $(".c-end.p"), endB = $(".c-end.b"), lead = $(".c-lead"), hover = $(".c-hover"), cross = $(".c-cross"), dotP = $(".c-dot.p"), dotB = $(".c-dot.b"), hit = $(".c-hit");
  let range = "1Y", cur = sample(range), dom = domain(cur), W = 0, H = 0, pad, anim = null, ready = false;

  const measure = () => {
    W = el.clientWidth; H = el.clientHeight;
    pad = { t: 10, r: cfg.yAxis === "right" ? 46 : 10, b: 22, l: cfg.yAxis === "left" ? 48 : 0 };
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    hit.setAttribute("x", pad.l); hit.setAttribute("width", Math.max(0, W - pad.l - pad.r)); hit.setAttribute("y", 0); hit.setAttribute("height", H);
  };
  const X = (i) => pad.l + (i / (N - 1)) * (W - pad.l - pad.r);
  const Y = (v, d = dom) => pad.t + (1 - (v - d[0]) / (d[1] - d[0])) * (H - pad.t - pad.b);
  const pathOf = (arr, d) => arr.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v, d).toFixed(1)}`).join("");
  const openClip = () => { clip.setAttribute("x", -20); clip.setAttribute("width", W + 40); };

  // grid, y labels and x labels of one domain in one group, so a range switch can crossfade old and new
  function axesGroup(s, d) {
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "c-ax");
    const ticks = niceTicks(d[0], d[1], 4);
    g.innerHTML = ticks.map((v) => `<line x1="${pad.l}" x2="${cfg.yAxis === "right" ? W - 46 : W - pad.r}" y1="${Y(v, d)}" y2="${Y(v, d)}"/>`).join("")
      + ticks.map((v) => cfg.yAxis === "left"
        ? `<text x="${pad.l - 10}" y="${Y(v, d) + 4}" text-anchor="end">${fmt0.format(v)}</text>`
        : `<text x="${W}" y="${Y(v, d) + 4}" text-anchor="end">${fmt0.format(v / 1000)}k</text>`).join("")
      + [0, 0.25, 0.5, 0.75, 1].map((f, k) => {
        const i = Math.round(f * (N - 1)), dt = s.d[i];
        const lab = s.long ? `${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}` : `${MONTHS[dt.getMonth()]} ${dt.getDate()}`;
        return `<text x="${X(i)}" y="${H - 4}" text-anchor="${k === 0 ? "start" : k === 4 ? "end" : "middle"}">${lab}</text>`;
      }).join("");
    return g;
  }
  function axes(s, d) { $(".c-axes").replaceChildren(axesGroup(s, d)); }
  function paint(p, b, d) {
    const lp = pathOf(p, d);
    line.setAttribute("d", lp);
    bench.setAttribute("d", pathOf(b, d));
    area.setAttribute("d", `${lp}L${X(N - 1)},${H - pad.b}L${X(0)},${H - pad.b}Z`);
    endP.setAttribute("cx", X(N - 1)); endP.setAttribute("cy", Y(p[N - 1], d));
    endB.setAttribute("cx", X(N - 1)); endB.setAttribute("cy", Y(b[N - 1], d));
  }
  function settle() {
    line.removeAttribute("pathLength"); line.style.strokeDasharray = ""; line.style.strokeDashoffset = "";
    area.style.opacity = ""; bench.style.opacity = "";
    endP.removeAttribute("opacity"); endB.removeAttribute("opacity"); lead.setAttribute("opacity", 0);
    openClip(); ready = true;
  }
  function full() { anim?.stop(); measure(); axes(cur, dom); paint(cur.p, cur.b, dom); settle(); }

  function intro() {
    measure(); axes(cur, dom);
    const ms = cfg.introMs ?? 1200;
    endP.setAttribute("opacity", 0); endB.setAttribute("opacity", 0);
    if (cfg.intro === "rise") {
      // the line grows up from the floor of the chart
      openClip();
      anim = tween(ms, (k) => {
        const f = (v) => dom[0] + (v - dom[0]) * k;
        paint(cur.p.map(f), cur.b.map(f), dom);
        cfg.onIntro?.(k, cur.p[N - 1]);
        if (k === 1) settle();
      }, easeOut);
    } else if (cfg.intro === "wipe") {
      // a lit point travels along the line and reveals it
      paint(cur.p, cur.b, dom);
      clip.setAttribute("x", 0); clip.setAttribute("width", 0);
      cfg.onIntro?.(0, cur.p[0]);
      anim = tween(ms, (k) => {
        const i = Math.round(k * (N - 1));
        clip.setAttribute("width", X(i) + 2);
        lead.setAttribute("cx", X(i)); lead.setAttribute("cy", Y(cur.p[i]));
        lead.setAttribute("opacity", k < 1 ? 1 : 0);
        cfg.onIntro?.(k, cur.p[i]);
        if (k === 1) settle();
      }, easeInOut);
    } else {
      // draw: the line traces itself, the benchmark and the area follow
      paint(cur.p, cur.b, dom);
      openClip();
      line.setAttribute("pathLength", 1); line.style.strokeDasharray = "1 1"; line.style.strokeDashoffset = 1;
      area.style.opacity = 0; bench.style.opacity = 0;
      anim = tween(ms, (k) => {
        line.style.strokeDashoffset = 1 - k;
        area.style.opacity = Math.max(0, (k - 0.45) / 0.55);
        bench.style.opacity = Math.max(0, (k - 0.25) / 0.75);
        cfg.onIntro?.(k, cur.p[Math.round(k * (N - 1))]);
        if (k === 1) settle();
      }, easeOut);
    }
  }

  function setRange(r) {
    if (r === range) return;
    if (!ready) full();
    anim?.stop();
    const from = cur, to = sample(r), d0 = dom, d1 = domain(to);
    range = r; cur = to;
    // old and new axes overlap: one fades out while the other fades in, no blank beat
    const holder = $(".c-axes"), old = holder.lastElementChild, next = axesGroup(to, d1);
    next.style.opacity = 0;
    holder.appendChild(next);
    setTimeout(() => { next.style.opacity = 1; if (old) old.style.opacity = 0; }, 16);
    setTimeout(() => old?.remove(), (cfg.morphMs ?? 650) * SPEED + 60);
    anim = tween(cfg.morphMs ?? 650, (k) => {
      const d = [d0[0] + (d1[0] - d0[0]) * k, d0[1] + (d1[1] - d0[1]) * k];
      paint(from.p.map((v, i) => v + (to.p[i] - v) * k), from.b.map((v, i) => v + (to.b[i] - v) * k), d);
      if (k === 1) dom = d1;
    }, easeInOut);
  }

  hit.addEventListener("pointermove", (e) => {
    if (!ready) return;
    const box = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(N - 1, Math.round(((((e.clientX - box.left) / box.width) * W - pad.l) / (W - pad.l - pad.r)) * (N - 1))));
    hover.setAttribute("opacity", 1);
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("y1", pad.t); cross.setAttribute("y2", H - pad.b);
    dotP.setAttribute("cx", X(i)); dotP.setAttribute("cy", Y(cur.p[i]));
    dotB.setAttribute("cx", X(i)); dotB.setAttribute("cy", Y(cur.b[i]));
    el.classList.add("scrubbing");
    cfg.onScrub?.({ d: cur.d[i], p: cur.p[i], b: cur.b[i], diff: (cur.p[i] / cur.b[i] - 1) * 100 });
  });
  hit.addEventListener("pointerleave", () => { hover.setAttribute("opacity", 0); el.classList.remove("scrubbing"); cfg.onScrub?.(null); });

  intro();
  return { setRange, resize: full, stop: () => anim?.stop() };
}

// per instrument: 1M of daily closes ending at the price, 1D intraday from the previous close
function withSeries(o) {
  let a = [...o.t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7);
  const rnd = () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());
  const vol = o.cur === "zł" ? 0.017 : 0.008;
  let prev = o.px / (1 + o.d1 / 100);
  const daily = [prev, o.px];
  for (let i = 0; i < 21; i++) { prev /= 1 + vol * gauss() + 0.0005; daily.unshift(prev); }
  const w = [0];
  for (let i = 1; i < 28; i++) w.push(w[i - 1] + gauss());
  const pc = daily[21], intra = w.map((x, i) => pc + (o.px - pc) * (i / 27) + (x - (w[27] * i) / 27) * pc * vol * 0.12);
  return { ...o, ser: { "1D": intra, "1W": daily.slice(-6), "1M": daily } };
}

  const W = 88, H = 28, p = 3, lo = Math.min(...arr), hi = Math.max(...arr), sp = hi - lo || 1;
  const X = (i) => (i / (arr.length - 1)) * W, Y = (v) => p + (1 - (v - lo) / sp) * (H - 2 * p);
  const d = arr.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  svg.querySelector(".sp-ln").setAttribute("d", d);
  svg.querySelector(".sp-area").setAttribute("d", `${d}L${W},${H}L0,${H}Z`);
  const base = svg.querySelector(".sp-base"), y = Y(arr[0]).toFixed(1);
  base.setAttribute("y1", y); base.setAttribute("y2", y);
  const ch = arr[arr.length - 1] / arr[0] - 1;
  svg.setAttribute("class", `sp ${Math.abs(ch) < 0.00005 ? "flat" : ch > 0 ? "pos" : "neg"}`);
}

function roll(el, text, cls) {
  if (cls != null) el.className = cls;
  if (el.textContent === text) return;
  el.textContent = text;
  if (SPEED) el.animate([{ opacity: 0, transform: "translateY(5px)", filter: "blur(2px)" }, { opacity: 1, transform: "none", filter: "blur(0)" }], { duration: 220 * SPEED, easing: "cubic-bezier(0.16, 1, 0.3, 1)" });
}

      </div></div>`,
    mount(root) {
      for (const el of root.querySelectorAll("[data-spark]")) {
        const vals = el.dataset.spark === "ytd" ? YTD : DD, w = el.clientWidth, h = el.clientHeight;
        const lo = Math.min(...vals, 0), hi = Math.max(...vals, 0), k = hi - lo || 1, py = (v) => 2 + (1 - (v - lo) / k) * (h - 4);
        const d = vals.map((v, i) => `${i ? "L" : "M"}${((i / (vals.length - 1)) * w).toFixed(1)},${py(v).toFixed(1)}`).join("");
        el.innerHTML = el.dataset.spark === "ytd"
          ? `<svg viewBox="0 0 ${w} ${h}"><line class="sp-zero" x1="0" x2="${w}" y1="${py(0)}" y2="${py(0)}"/><path class="sp-line" pathLength="1" d="${d}"/></svg>`
          : `<svg viewBox="0 0 ${w} ${h}"><path class="sp-dd" d="${d}L${w},${py(0)}L0,${py(0)}Z"/></svg>`;
      }
      // cursor spotlight on tiles
      root.addEventListener("pointermove", (e) => {
        const t = e.target.closest(".tile");

        const r = t.getBoundingClientRect();
        t.style.setProperty("--mx", `${e.clientX - r.left}px`); t.style.setProperty("--my", `${e.clientY - r.top}px`);
      });
      const wrap = root.querySelector("[data-stack]"), chips = root.querySelector("[data-chips]");
      chips.addEventListener("mouseover", (e) => { const c = e.target.closest(".chip-b"); if (!c) return; wrap.classList.add("focus"); for (const s of wrap.querySelectorAll(".stack i")) s.classList.toggle("on", s.dataset.i === c.dataset.i); });
      chips.addEventListener("mouseleave", () => wrap.classList.remove("focus"));
      for (const el of root.querySelectorAll("[data-count]")) countUp(el, +el.dataset.count, { ms: 1000, delay: 250 });
      const sub = root.querySelector("[data-sub]");
      const rest = `<span class="delta neg">PLN 31.28 (0.1%)</span><span>this week</span><span class="dimmer">·</span><span>TWR 12m <b class="pos">+1.7%</b></span><span>XIRR <b>2.4%</b></span>`;
      sub.innerHTML = rest;
      return Chart(root.querySelector("[data-chart]"), {
        yAxis: "right", intro: "rise", introMs: 1100,
        onIntro: (k) => setHero(root, 61789.61 * (0.9 + 0.1 * k)),
        onScrub(s) {
          if (!s) { setHero(root, 61789.61); sub.innerHTML = rest; return; }
          setHero(root, s.p);
          sub.innerHTML = `<span class="when">${dateLong(s.d)}</span><span>MSCI ACWI ${pln(s.b)}</span><span class="${s.diff >= 0 ? "pos" : "neg"}">${pct(s.diff)} vs benchmark</span>`;
        },
      });
    },
  },

        cash.style.visibility = A.mode === "Portfolio" ? "" : "hidden";
      };
      const rowOf = (o) => body.querySelector(`[data-t="${o.t}"]`);
      // re-sort in place: rows glide to their new slots (FLIP, ease-in-out for a move)
      const resort = () => {
        const rows = [...body.children];
        for (const r of rows) r.classList.remove("r-in");
        const first = new Map(rows.map((r) => [r, r.getBoundingClientRect().top]));
        for (const o of list()) body.appendChild(rowOf(o));
        if (!SPEED) return;
        for (const r of rows) {
          const dy = first.get(r) - r.getBoundingClientRect().top;
          if (dy) r.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 380 * SPEED, easing: "cubic-bezier(0.65, 0, 0.35, 1)" });
        }
      };
      drawHead(); drawBody("300ms");
      // lab only: ?card=TICKER pins that tile's hover card open, for screenshots
      const pin = new URLSearchParams(location.search).get("card");
      if (pin) { const r = body.querySelector(`[data-t="${pin}"]`); r?.classList.add("open"); r?.querySelector(".tile-w").classList.add("open"); }
      head.addEventListener("click", (e) => {
        const b = e.target.closest("[data-sort]");
        if (!b) return;
        if (A.sort === b.dataset.sort) A.dir *= -1; else { A.sort = b.dataset.sort; A.dir = -1; }
        drawHead(); resort();
      });
      root.querySelector('[data-seg="assets"]').addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b || b.textContent.trim() === A.mode) return;
        A.mode = b.textContent.trim();
        A.sort = A.mode === "Watchlist" ? "ret" : "weight"; A.dir = -1;
        body.classList.add("out");
        setTimeout(() => { drawHead(); drawBody("0ms"); body.classList.remove("out"); }, 130 * SPEED);
      });
      root.querySelector('[data-seg="period"]').addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b || b.textContent.trim() === A.period) return;
        A.period = b.textContent.trim();
        const from = new Map(data[A.mode].map((o) => [o, o.sp]));
        for (const o of data[A.mode]) { o.sp = resample(o.ser[A.period]); const c = chg(o); roll(rowOf(o).querySelector("[data-ch]"), pct2(c), tone(c)); }
        tween(450, (k) => { for (const o of data[A.mode]) drawSpark(rowOf(o).querySelector(".sp"), from.get(o).map((v, i) => v + (o.sp[i] - v) * k)); }, easeInOut);
        if (A.sort === "chg") setTimeout(resort, 470 * SPEED);
      });
      // live prices: one instrument ticks every few seconds (stands in for the 5 minute refresh)
      const timer = setInterval(() => {
        const arr = data[A.mode], o = arr[Math.floor(Math.random() * arr.length)], f = 1 + (Math.random() - 0.48) * 0.004;
        o.px *= f;
        for (const s of Object.values(o.ser)) s[s.length - 1] = o.px;
        o.sp = resample(o.ser[A.period]);
        const r = rowOf(o);
        if (!r) return;
        const c = chg(o);
        roll(r.querySelector("[data-px]"), fpx(o));
        roll(r.querySelector("[data-ch]"), pct2(c), tone(c));
        drawSpark(r.querySelector(".sp"), o.sp);
        if (o.val) { o.val *= f; o.ret = ((1 + o.ret / 100) * f - 1) * 100; roll(r.querySelector("[data-val]"), pln(o.val)); r.querySelector("[data-val] + span").textContent = pct(o.ret); }
      }, 3500);

      const c = Chart(root.querySelector("[data-chart]"), {
        yAxis: "left", intro: "wipe", introMs: 1400, morphMs: 450,
        onIntro: (k, v) => setHero(root, v),
        onScrub(s) {
          if (!s) { setHero(root, TOTAL); sub.innerHTML = rest; return; }
          setHero(root, s.p);
          sub.innerHTML = `<span class="when">${dateLong(s.d)}</span><span>MSCI ACWI <span class="amt">${pln(s.b)}</span></span><span class="${s.diff >= 0 ? "pos" : "neg"}">${pct(s.diff)} vs benchmark</span>`;
        },
      });
      return { ...c, stop() { clearInterval(timer); c.stop(); } };
    },
  },
};

/* ============================== mount, segs, lab bar ============================== */
let current = null, chart = null;
function placeThumb(seg, instant) {
  const b = seg.querySelector("button.active"), th = seg.querySelector(".thumb"), hi = seg.querySelector(".seg-hi");
  if (!b || !th) return;
  const parts = hi ? [th, hi] : [th];
  if (instant) for (const p of parts) p.style.transition = "none";
  th.style.width = `${b.offsetWidth}px`; th.style.transform = `translateX(${b.offsetLeft}px)`;
  if (hi) hi.style.clipPath = `inset(2px ${seg.clientWidth - b.offsetLeft - b.offsetWidth}px 2px ${b.offsetLeft}px round 6px)`;
  if (instant) setTimeout(() => { for (const p of parts) p.style.transition = ""; }, 32);
}
function mount(id) {
  chart?.stop();
  current = VARIANTS[id] ? id : "V1";
  const root = document.getElementById("root");
  root.innerHTML = VARIANTS[current].html();
  const inner = root.firstElementChild;
  chart = VARIANTS[current].mount(inner);
  for (const seg of root.querySelectorAll(".seg")) {
    placeThumb(seg, true);
    seg.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      for (const o of seg.querySelectorAll("button")) o.classList.toggle("active", o === b);
      placeThumb(seg);
      if (seg.dataset.seg === "range") chart.setRange(b.textContent.trim());
    });
  }
  // growth transitions start one frame after mount
  void inner.offsetWidth;
  setTimeout(() => inner.classList.add("in"), 16);
  history.replaceState(null, "", `#${current}`);
  drawBar();
}
const MOTION = [["Motion", 1], ["Slow ×4", 4], ["Motion off", 0]];
function setSpeed(s) { SPEED = s; document.documentElement.style.setProperty("--speed", s); drawBar(); }
function cycleSpeed() { const i = MOTION.findIndex((m) => m[1] === SPEED); setSpeed(MOTION[(i + 1) % MOTION.length][1]); }
function drawBar() {
  document.getElementById("labbar").innerHTML = `${Object.entries(VARIANTS).map(([k, v], i) => `<button data-v="${k}" class="${k === current ? "on" : ""}"><kbd>${i + 1}</kbd>${v.name}</button>`).join("")}
    <span class="sep"></span><button data-act="replay"><kbd>R</kbd>Replay entrance</button>
    <button data-act="speed"><kbd>M</kbd>${MOTION.find((m) => m[1] === SPEED)?.[0] ?? "Motion"}</button>`;
  document.getElementById("labnote").textContent = VARIANTS[current]?.note ?? "";
}
document.getElementById("labbar").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.v) mount(b.dataset.v);
  else if (b.dataset.act === "replay") mount(current);
  else if (b.dataset.act === "speed") cycleSpeed();
});
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const keys = Object.keys(VARIANTS);
  if (/^[1-9]$/.test(e.key) && keys[+e.key - 1]) mount(keys[+e.key - 1]);
  else if (e.key.toLowerCase() === "r") mount(current);
  else if (e.key.toLowerCase() === "m") cycleSpeed();
});
addEventListener("resize", () => { chart?.resize(); for (const s of document.querySelectorAll(".seg")) placeThumb(s, true); });
document.documentElement.style.setProperty("--speed", SPEED);
mount(location.hash.slice(1));
document.fonts?.ready.then(() => { for (const x of document.querySelectorAll(".seg")) placeThumb(x, true); });
</script>
