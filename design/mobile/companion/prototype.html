<!doctype html>
<!--
  cashU mobile companion - clickable prototype (concept v1.1, 2026-11-12).
  One phone, every screen. Synthetic data only (people, balances, positions are invented;
  public instrument names and tickers are fine).

  The concept in one line: the phone is a calm mirror of what the Mac fetched - glance, find, sort,
  decide small. Everything that builds or changes the setup stays on the Mac.

  Two people, two vaults: Anna's own profile (budget, car, investments) and the shared Home profile
  (budget, flat, mortgage) that Piotr's phone is paired to. Never mixed, never added up.

  URL switches:
    ?screen=<id>     today, stale, close, spending, activity, search, triage, tx, cash, portfolio, alert,
                     position, review, note, strategy, networth, loan, profile, notifs, lock, widget, pair
    &as=partner      Piotr's phone (Home profile, 3 tabs)
    &incognito=1     hidden amounts (bananas), &theme=light, &step=N (pair / review card), &offline=1
    &bare            no device chrome / side panel (for the hub's iframes); &still = no motion
  Keys: 1-4 tabs, H hide amounts, T theme, P owner / partner, Esc back.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cashU companion - prototype</title>
<style>
:root {
  color-scheme: dark;
  --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius-tile: 16px; --radius-widget: 28px;
  --ease-tile: cubic-bezier(0.16, 1, 0.3, 1);

  --color-surface: #0a0a0b; --color-surface-raised: #0e0e10; --color-surface-sunken: #070708;
  --color-subtle: #111113; --color-chip: #17171a;
  --color-fg: #ededf0; --color-fg-secondary: #a3a3ab; --color-fg-muted: #6e6e77; --color-fg-faint: #4a4a52;
  --color-border-strong: rgba(255,255,255,.18);
  --color-accent: #8ea4ff; --color-accent-muted: rgba(142,164,255,.13); --color-on-accent: #0a0a0b;
  --color-positive: #4cc38a; --color-positive-bg: rgba(76,195,138,.12);
  --color-negative: #ef6f6c; --color-negative-bg: rgba(239,111,108,.12);
  --color-warning: #e5a54a; --color-warning-bg: rgba(229,165,74,.12);
  --color-scrim: rgba(0,0,0,.6); --color-chart-grid: rgba(255,255,255,.065);
  --tile-top: #161619; --tile-ring: rgba(255,255,255,.065); --tile-ring-hover: rgba(255,255,255,.11);
  --tile-edge: rgba(255,255,255,.05);
  --elevation-tile: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -18px rgba(0,0,0,.85);
  --sub-top: rgba(255,255,255,.035); --sub-bottom: rgba(255,255,255,.012); --sub-edge: rgba(255,255,255,.04);
  --track: rgba(255,255,255,.06); --press: rgba(255,255,255,.05);
  --bar-bg: rgba(10,10,11,.78); --sheet-bg: #141416; --seg-bg: rgba(0,0,0,.3); --seg-thumb: #232327;
  --c-housing: #8ea4ff; --c-groceries: #5cc0d6; --c-shopping: #b39cff; --c-travel: #e5a54a; --c-dining: #4cc38a;
  --c-transport: #ef8fb0; --c-entertainment: #7d8fd6; --c-health: #9aa0a8; --c-subs: #6fa3a8; --c-other: #5d5d66;
  --c-income: #4cc38a; --c-home: #d2a679;
  --nw-money: #8ea4ff; --nw-property: #5cc0d6; --nw-vehicle: #4cc38a; --nw-invest: #e5a54a;
  --inv-global: #8ea4ff; --inv-pl: #e5a54a; --inv-bonds: #5cc0d6; --inv-cash: #b39cff;
  --stage: #050506;
}
:root[data-theme="light"] {
  color-scheme: light;
  --color-surface: #f6f7f9; --color-surface-raised: #ffffff; --color-surface-sunken: #eceef1;
  --color-subtle: #f9fafb; --color-chip: #eef1f5;
  --color-fg: #1a1d21; --color-fg-secondary: #374151; --color-fg-muted: #6b7280; --color-fg-faint: #9aa4b2;
  --color-border-strong: #b8c0ca;
  --color-accent: #2563eb; --color-accent-muted: #dbe5fb; --color-on-accent: #ffffff;
  --color-positive: #16a34a; --color-positive-bg: rgba(22,163,74,.10);
  --color-negative: #dc2626; --color-negative-bg: rgba(220,38,38,.10);
  --color-warning: #b45309; --color-warning-bg: rgba(180,83,9,.12);
  --color-scrim: rgba(15,18,22,.35); --color-chart-grid: #eef0f3;
  --tile-top: #ffffff; --tile-ring: rgba(16,18,22,.08); --tile-ring-hover: rgba(16,18,22,.14);
  --tile-edge: rgba(255,255,255,.7);
  --elevation-tile: 0 1px 2px rgba(16,18,22,.04), 0 14px 34px -18px rgba(16,18,22,.16);
  --sub-top: rgba(16,18,22,.025); --sub-bottom: rgba(16,18,22,.01); --sub-edge: rgba(255,255,255,.7);
  --track: rgba(16,18,22,.07); --press: rgba(16,18,22,.05);
  --bar-bg: rgba(246,247,249,.82); --sheet-bg: #ffffff; --seg-bg: var(--color-surface-sunken); --seg-thumb: #ffffff;
  --c-housing: #2563eb; --c-groceries: #0891b2; --c-shopping: #7c3aed; --c-travel: #d97706; --c-dining: #059669;
  --c-transport: #db2777; --c-entertainment: #4f46e5; --c-health: #6b7280; --c-subs: #0f766e; --c-other: #9aa4b2;
  --c-income: #16a34a; --c-home: #a16207;
  --nw-money: #2563eb; --nw-property: #0891b2; --nw-vehicle: #16a34a; --nw-invest: #d97706;
  --inv-global: #2563eb; --inv-pl: #d97706; --inv-bonds: #0891b2; --inv-cash: #7c3aed;
  --stage: #e4e6ea;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--stage); color: var(--color-fg);
  font: 15px/20px var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; justify-content: center; gap: 48px; min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.s { width: 16px; height: 16px; } .ic.l { width: 24px; height: 24px; }

/* ---------- side panel (standalone only) ---------- */
.panel { width: 250px; font-size: 13px; color: var(--color-fg-secondary); align-self: center; }
.panel h1 { font-size: 17px; margin: 0 0 4px; color: var(--color-fg); letter-spacing: -.01em; }
.panel p { margin: 0 0 14px; color: var(--color-fg-muted); line-height: 18px; }
.panel .grp { margin: 14px 0 6px; color: var(--color-fg-muted); font-size: 12px; }
.panel .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.panel .opts button { height: 28px; padding: 0 10px; border-radius: 8px; background: var(--color-chip); color: var(--color-fg-secondary); box-shadow: inset 0 0 0 1px var(--tile-ring); font-size: 12px; }
.panel .opts button.on { background: var(--color-fg); color: var(--color-surface); box-shadow: none; }
.panel a { color: var(--color-accent); text-decoration: none; }

/* ---------- device ---------- */
.device { position: relative; width: 390px; height: 844px; flex: none; border-radius: 56px; overflow: hidden; background: var(--color-surface); isolation: isolate; box-shadow: 0 0 0 11px #1b1b1e, 0 0 0 12px #3a3a3f, 0 50px 90px -30px rgba(0,0,0,.7); }
body.bare { display: block; background: var(--color-surface); min-height: 0; }
body.bare .panel, body.bare .designed-by { display: none !important; }
body.bare .device { border-radius: 0; box-shadow: none; }
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 60; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 44px; font: 600 16px/1 var(--font); pointer-events: none; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--color-fg); opacity: .85; z-index: 80; pointer-events: none; }
.on-lock .statusbar, .on-home .statusbar { color: #fff; } .on-lock .statusbar .time { visibility: hidden; }
.on-lock .home-ind, .on-home .home-ind { background: #fff; }

#app { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--color-surface); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 16px 120px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.screen.modal .scroll { padding-bottom: 40px; }
.enter { animation: push 380ms var(--ease-tile) both; }
@keyframes push { from { transform: translateX(28%); opacity: .4; } to { transform: none; opacity: 1; } }
.still .enter, .still .rise, .still .sheet, .still .scrim { animation: none !important; }

/* header */
.top { padding: 54px 16px 0; flex: none; }
.top-row { height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.who { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 5px; border-radius: 999px; background: var(--color-chip); box-shadow: inset 0 0 0 1px var(--tile-ring); font-size: 13.5px; font-weight: 550; color: var(--color-fg-secondary); }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 650 12px/1 var(--font); color: #0a0a0b; background: #c9d3ff; flex: none; }
.av.home { background: #e6c9a6; }
.who .ic { width: 14px; height: 14px; color: var(--color-fg-muted); }
.icon-btn { min-width: 40px; height: 40px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; background: var(--color-chip); box-shadow: inset 0 0 0 1px var(--tile-ring); color: var(--color-fg-secondary); font-size: 13.5px; font-weight: 550; }
.icon-btn.txt { padding: 0 13px 0 10px; }
.icon-btn:active, .btn:active, .who:active { transform: scale(.95); }
.icon-btn.on { background: var(--color-accent-muted); color: var(--color-accent); box-shadow: none; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.ltitle { font: 700 30px/36px var(--font); letter-spacing: -.03em; margin: 8px 0 2px; }
.fresh { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--color-fg-muted); margin-bottom: 14px; }
.fresh b { color: var(--color-fg-secondary); font-weight: 550; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-fg-faint); flex: none; }
.dot.ok { background: var(--color-positive); } .dot.warn { background: var(--color-warning); } .dot.neg { background: var(--color-negative); } .dot.acc { background: var(--color-accent); }
.chip-off { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; color: var(--color-fg-secondary); background: var(--color-chip); box-shadow: inset 0 0 0 1px var(--tile-ring); }

/* pushed / modal header */
.navbar { padding: 54px 8px 0; height: 98px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.navbar .back { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px; color: var(--color-fg-secondary); font-size: 15px; justify-self: start; }
.navbar .x { justify-self: start; margin-left: 8px; }
.navbar .t { font: 600 17px/22px var(--font); text-align: center; }
.navbar .r { justify-self: end; padding-right: 8px; display: flex; gap: 8px; }

/* tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; z-index: 40; display: grid; padding: 7px 10px 0; background: var(--bar-bg); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: inset 0 1px 0 var(--tile-ring); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; height: 48px; color: var(--color-fg-muted); font-size: 10.5px; font-weight: 550; position: relative; }
.tabbar button.on { color: var(--color-fg); }
.tabbar .badge { position: absolute; top: 0; left: calc(50% + 7px); width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 0 2px var(--color-surface); }

/* tiles */
.tile { position: relative; border-radius: var(--radius-widget); padding: 18px; background: linear-gradient(180deg, var(--tile-top), var(--color-surface-raised) 58%); box-shadow: inset 0 0 0 1px var(--tile-ring), inset 0 1px 0 var(--tile-edge), var(--elevation-tile); }
.tile + .tile, .tile + .sec, .sec + .tile, .note + .tile { margin-top: 12px; }
.tile.tap:active { transform: scale(.985); }
.rise { animation: rise 560ms var(--ease-tile) both; }
.rise:nth-child(2) { animation-delay: 50ms; } .rise:nth-child(3) { animation-delay: 100ms; } .rise:nth-child(4) { animation-delay: 150ms; } .rise:nth-child(n+5) { animation-delay: 200ms; }
@keyframes rise { from { transform: translateY(10px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.t-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; font-size: 13px; font-weight: 500; color: var(--color-fg-secondary); }
.t-h .r { font-size: 12.5px; color: var(--color-fg-muted); display: inline-flex; align-items: center; gap: 2px; }
.t-h .r b { color: var(--color-fg-secondary); font-weight: 600; }
.sec { font-size: 13px; font-weight: 550; color: var(--color-fg-muted); margin: 22px 4px 8px; display: flex; justify-content: space-between; }

.hero-fig { display: flex; align-items: flex-start; font-weight: 700; letter-spacing: -.035em; line-height: 1; margin-top: 12px; white-space: nowrap; color: var(--color-fg); }
.hero-fig .cur { font-size: 17px; font-weight: 600; color: var(--color-fg-muted); letter-spacing: 0; margin: 5px 6px 0 0; }
.hero-fig .int { font-size: 50px; }
.hero-fig .dec { font-size: 26px; color: var(--color-fg-muted); margin-top: 4px; letter-spacing: -.02em; }
.hero-fig.m .int { font-size: 40px; } .hero-fig.m .dec { font-size: 22px; } .hero-fig.m .cur { font-size: 15px; margin-top: 3px; }
.hero-sub { font-size: 12.5px; color: var(--color-fg-muted); margin-top: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pos { color: var(--color-positive); } .neg { color: var(--color-negative); } .warn { color: var(--color-warning); } .muted { color: var(--color-fg-muted); } .acc { color: var(--color-accent); }
b.pos, b.neg { font-weight: 650; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px -18px -18px; border-top: 1px solid var(--tile-ring); }
.kpis > div { padding: 12px 18px 15px; border-left: 1px solid var(--tile-ring); min-width: 0; }
.kpis > div:first-child { border-left: 0; }
.kpis .l { font-size: 11.5px; color: var(--color-fg-muted); }
.kpis .v { font-size: 15px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; white-space: nowrap; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.fact { padding: 11px 13px; border-radius: var(--radius-tile); display: grid; gap: 2px; align-content: start; background: linear-gradient(180deg, var(--sub-top), var(--sub-bottom)); box-shadow: inset 0 0 0 1px var(--tile-ring), inset 0 1px 0 var(--sub-edge); min-width: 0; }
.fact .l { font-size: 11.5px; color: var(--color-fg-muted); }
.fact .v { font-size: 16px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; }
.fact .d { font-size: 11px; color: var(--color-fg-muted); }

/* pace meter */
.pace { margin-top: 16px; }
.pace .track { position: relative; height: 8px; border-radius: 4px; background: var(--track); }
.pace .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--color-fg-secondary); }
.pace .mark { position: absolute; top: -4px; width: 2px; height: 16px; border-radius: 1px; background: var(--color-fg); }
.pace .lbl { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--color-fg-muted); }

/* rows: separators are inset pseudo-elements, so the press shape never bends them */
.rows { margin-top: 6px; }
.row { position: relative; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 1px 12px; align-items: center; padding: 11px 0; }
.row::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: var(--tile-ring); }
.rows > .row:first-child::before, .listcard > .row:first-child::before, .group > .row:first-child::before, .row.first::before { display: none; }
.row.nolead { grid-template-columns: minmax(0,1fr) auto; }
.row .lead { grid-row: span 2; }
.row .n { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .v { font-weight: 650; text-align: right; white-space: nowrap; }
.row .s { font-size: 12px; color: var(--color-fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s2 { font-size: 12px; color: var(--color-fg-muted); text-align: right; white-space: nowrap; }
.row .full { grid-column: 1 / -1; }
.row .neg { color: var(--color-negative); } .row .pos { color: var(--color-positive); }
.row.tap { margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 14px; cursor: pointer; }
.row.tap::before { left: 10px; right: 10px; }
.row.tap:active { background: var(--press); }
.row .chev { color: var(--color-fg-faint); }
.row.dim .n, .row.dim .v { color: var(--color-fg-muted); }
.rows.tight .row { padding: 9px 0; }
.lead-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--color-chip); box-shadow: inset 0 0 0 1px var(--tile-ring); color: var(--color-fg-secondary); }
.lead-ic.warn { color: var(--color-warning); background: var(--color-warning-bg); box-shadow: none; }
.lead-ic.neg { color: var(--color-negative); background: var(--color-negative-bg); box-shadow: none; }
.lead-ic.acc { color: var(--color-accent); background: var(--color-accent-muted); box-shadow: none; }
.lead-ic.pos { color: var(--color-positive); background: var(--color-positive-bg); box-shadow: none; }
.date-ic { width: 34px; height: 36px; border-radius: 10px; display: grid; place-items: center; align-content: center; gap: 1px; background: var(--color-chip); box-shadow: inset 0 0 0 1px var(--tile-ring); }
.date-ic .d { font: 700 14px/1 var(--font); } .date-ic .w { font: 600 9.5px/1 var(--font); color: var(--color-fg-muted); }
.swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; display: inline-block; }
.meter { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 7px; }
.meter > i { display: block; height: 100%; border-radius: 3px; }
.ticker { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #000; color: #ededf0; font: 650 9px/1 var(--font); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
:root[data-theme="light"] .ticker { background: #1a1d21; }
.ticker.risk { box-shadow: inset 0 0 0 1.5px var(--color-negative); }

.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; color: var(--color-fg-secondary); background: rgba(127,127,127,.1); white-space: nowrap; }
.tag.pos { color: var(--color-positive); background: var(--color-positive-bg); }
.tag.neg { color: var(--color-negative); background: var(--color-negative-bg); }
.tag.warn { color: var(--color-warning); background: var(--color-warning-bg); }
.tag.acc { color: var(--color-accent); background: var(--color-accent-muted); }
.catpill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-fg-muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 46px; padding: 0 18px; border-radius: 14px; font-size: 15px; font-weight: 550; background: var(--color-chip); color: var(--color-fg); box-shadow: inset 0 0 0 1px var(--tile-ring-hover); }
.btn.primary { background: var(--color-fg); color: var(--color-surface); box-shadow: none; font-weight: 600; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--color-fg-secondary); }
.btn.sm { height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btns { display: flex; gap: 8px; margin-top: 16px; }
.btns .btn { flex: 1; }
.link { font-size: 12.5px; color: var(--color-fg-muted); display: inline-flex; align-items: center; gap: 2px; }

.seg { position: relative; display: inline-flex; padding: 2px; gap: 1px; border-radius: 11px; background: var(--seg-bg); box-shadow: inset 0 0 0 1px var(--tile-ring); }
.seg button { height: 36px; padding: 0 13px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--color-fg-muted); }
.seg button.on { color: var(--color-fg); background: var(--seg-thumb); box-shadow: inset 0 0 0 1px var(--tile-ring-hover), 0 1px 3px rgba(0,0,0,.3); }
.seg.full { display: flex; } .seg.full button { flex: 1; }

.row.att { align-items: start; } .row.att .n, .row.att .s { white-space: normal; } .row.att .lead { align-self: center; }
.quiet { display: flex; align-items: center; gap: 8px; width: 100%; margin: 10px 0 -4px; padding: 10px 0 2px; border-top: 1px solid var(--tile-ring); font-size: 12.5px; color: var(--color-fg-muted); text-align: left; }
.quiet span { flex: 1; } .quiet b { font-weight: 550; color: var(--color-fg-secondary); }

function series(n, end, drift, seed, vol) {
  let s = seed, out = [], v = end;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280 - 0.5;
  for (let i = 0; i < n; i++) { out.unshift(v); v = v / (1 + drift) * (1 + rnd() * vol); }
  return out;
}
function area(vals, w, h, opts = {}) {
  const all = opts.level != null ? [...vals, opts.level] : vals;
  const min = Math.min(...all), max = Math.max(...all), pad = 8;
  const x = (i) => (i / (vals.length - 1)) * w, y = (v) => pad + (1 - (v - min) / (max - min || 1)) * (h - pad * 2);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const id = 'g' + Math.random().toString(36).slice(2, 7), col = opts.color || 'var(--color-accent)';
  const lvl = opts.level != null ? `<line x1="0" x2="${w}" y1="${y(opts.level)}" y2="${y(opts.level)}" stroke="var(--color-fg-muted)" stroke-dasharray="3 3" stroke-width="1"/><text x="2" y="${y(opts.level) + 14}" font-size="10.5" fill="var(--color-fg-muted)">${opts.levelLabel || ''}</text>` : '';
  const grid = [0.25, 0.5, 0.75].map((f) => `<line x1="0" x2="${w}" y1="${(h * f).toFixed(1)}" y2="${(h * f).toFixed(1)}" stroke="var(--color-chart-grid)"/>`).join('');
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px;overflow:visible">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="M0,${h} L${pts.join(' L')} L${w},${h} Z" fill="url(#${id})"/>
    <path d="M${pts.join(' L')}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${lvl}
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3.5" fill="${col}" stroke="var(--color-surface-raised)" stroke-width="2"/></svg>`;
}
function donut(parts, size, stroke, center) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, tot = sum(parts.map((p) => p[0])), gap = 2.2;
  let off = 0;
  const arcs = parts.map(([v, col]) => {
    const len = (v / tot) * c, seg = `<circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-dasharray="${Math.max(len - gap, 0.5)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
    off += len; return seg;
  }).join('');
  return `<div style="position:relative;width:${size}px;height:${size}px;margin:0 auto"><svg width="${size}" height="${size}">${arcs}</svg><div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">${center}</div></div>`;
}

  return `<div class="row nolead tap ${c === 'transfer' ? 'dim' : ''}" data-sheet="tx:${t.id}"><span class="n">${o.name || t.n}</span><span class="v">${amt}</span><span class="s">${sub}</span><span class="s2">${t.cash ? 'cash' : ''}</span></div>`;

function activityList() {
  const q = S.q.trim().toLowerCase(), tx = D().tx;
  if (q) {
    const hits = tx.filter((t) => (t.n + ' ' + t.title + ' ' + catName(t.cat)).toLowerCase().includes(q) || nf(Math.abs(t.v), 2).includes(q));
    if (!hits.length) return `<div class="note" style="justify-content:center;margin-top:30px">No payments match “${S.q}”.</div>`;
    const same = hits.length > 1 && hits.every((h) => h.n === hits[0].n);
    const head = same ? `<div class="tile rise" style="margin-top:4px"><div class="t-h">${hits[0].n}<span class="r">${hits.length} payments since ${hits[hits.length - 1].day.split(' ').pop()}</span></div>
        <div class="rows">${hits.map((h, i) => { const prev = hits[i + 1]; return `<div class="row nolead"><span class="n">${h.day.split(' ').pop()}</span><span class="v">${money(h.v)}</span><span class="s">${h.day.split(' ').slice(1, 3).join(' ')}</span><span class="s2 ${prev ? 'neg' : ''}">${prev ? pct((Math.abs(h.v) - Math.abs(prev.v)) / Math.abs(prev.v) * 100) + ' vs the year before' : ''}</span></div>`; }).join('')}</div></div>` : '';
    return `${head}<div class="day"><span>${hits.length} payments</span><span>all history · searched on this phone</span></div><div class="listcard">${hits.map((t) => txRow(t, { name: t.old ? t.day : t.n })).join('')}</div>`;
  }
  let list = tx.filter((t) => !t.old);
  if (S.filter === 'need') list = list.filter((t) => !t.cat && !S.categorized[t.id]);
  if (S.filter === 'cash') list = list.filter((t) => t.cash);
  if (S.filter === 'income') list = list.filter((t) => t.cat === 'income');
  const days = [...new Set(list.map((t) => t.day))];
  return days.map((day) => {
    const items = list.filter((t) => t.day === day);
    const out = sum(items.filter((t) => t.v < 0 && t.cat !== 'transfer').map((t) => t.v));
    return `<div class="day"><span>${day}</span><span>${out ? `spent ${money(-out)}` : ''}</span></div><div class="listcard">${items.map((t) => txRow(t)).join('')}</div>`;
  }).join('') || `<div class="note" style="justify-content:center;margin-top:30px">Nothing here.</div>`;
}

    <div class="sec">Digests</div><div class="group">${r('Sunday, 18:00', 'The week in one line, next week\'s bills' + (p ? '' : ', review due') + '.', true)}${r('Month closed', 'What you kept' + (p ? '' : ' and what your plan says') + '.', true)}${r('Evening, 19:00', 'Bills due tomorrow, payments to categorize. Skipped when empty.', false)}</div>
    ${p ? '' : `<div class="sec">Warnings, once</div><div class="group">${r('Bank data is getting old', 'After 36 hours without a fetch; again only if it gets worse.', true)}${r('A bank permission ends soon', '7 days and 1 day before.', true)}</div>`}
    <div class="note">${ic('shield', 's')}<span>Notifications only count things - never amounts, payees or names. They are written on this phone; nothing readable passes through a push service.</span></div>
    <div class="note">${ic('close', 's')}<span>Never sent: single payments, daily portfolio moves, market news, ${p ? '' : 'agent suggestions, '}streaks.</span></div>
  </div>${tabBar()}</div>`;
} };

/* ---------- Lock screen ---------- */
SCREENS.lock = { tab: 'today', modal: true, render: () => `<div class="screen modal"><div class="wall">
    <div class="date">Thursday 12 November</div><div class="clock">19:02</div>
    <div style="margin-top:auto;margin-bottom:56px">
      <div class="notif"><span class="appic">cU</span><span class="ttl">cashU · Anna</span><span class="when">now</span><span class="msg">1 bill due tomorrow. 4 payments to categorize.</span></div>
      <div class="notif"><span class="appic">cU</span><span class="ttl">cashU · Anna</span><span class="when">09:12</span><span class="msg">An alert you follow fired. Open cashU to see it.</span></div>
      <div class="notif" style="opacity:.8"><span class="appic">cU</span><span class="ttl">cashU · Home</span><span class="when">Sun</span><span class="msg">Your week is ready. 3 bills next week.</span></div>
    </div></div></div>` };

/* ---------- Home-screen widget ---------- */
SCREENS.widget = { tab: 'today', modal: true, render: () => {
  const m = D().month, n = toCat().length;
  const apps = ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#a855f7', '#14b8a6', '#64748b', '#ec4899'];
  return `<div class="screen modal"><div class="wall" style="background:radial-gradient(120% 80% at 70% 10%, #3b3150 0%, #161321 50%, #07070a 100%)">
    <div class="hs">
      <div class="widget wide"><div class="w-h"><span class="appic">cU</span>cashU · ${D().who[1]}<span style="margin-left:auto;color:#6e6e77">06:40</span></div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px">
          <div><div style="font-size:12px;color:#a3a3ab">${label('On track to keep')}</div>
          <div style="font:700 34px/1 var(--font);letter-spacing:-.03em;margin-top:6px">${S.incog ? `🍌 ${bfmt(bananas(keep(m), 'PLN'))}` : `<span style="font-size:15px;color:#6e6e77;font-weight:600;vertical-align:top">PLN </span>${nf(keep(m), 0)}`}</div></div>
          <div style="text-align:right;font-size:12px;color:#a3a3ab;line-height:17px">${S.incog ? 'spending under usual' : `<span style="color:#4cc38a;font-weight:650">${nf(m.usualToDate - m.spent, 0)} under</span> usual`}<br>next: ${D().upcoming[0].n}, ${D().upcoming[0].w}</div></div>
        <div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:14px"><i style="position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#a3a3ab;width:${(m.spent / m.usualMonth * 100).toFixed(0)}%"></i><i style="position:absolute;top:-3px;width:2px;height:12px;background:#ededf0;left:${(m.usualToDate / m.usualMonth * 100).toFixed(0)}%"></i></div></div>
      <div class="widget small"><div class="w-h"><span class="appic">cU</span>Needs you</div>
        <div style="font:700 40px/1 var(--font);margin-top:16px">${n + (isPartner() ? 0 : 1)}</div>
        <div style="font-size:12.5px;color:#a3a3ab;margin-top:8px;line-height:17px">${n} to categorize${isPartner() ? '' : '<br>1 alert'}</div></div>
      ${apps.slice(0, 4).map((c) => `<div class="app"><i style="background:${c}"></i>App</div>`).join('')}
      ${apps.slice(4).map((c) => `<div class="app"><i style="background:${c}"></i>App</div>`).join('')}
    </div></div></div>`;
} };

/* ---------- Pairing / first run ---------- */
SCREENS.pair = { tab: 'today', modal: true, render: () => {
  const st = Math.min(S.step, 3);
  const body = [
    () => `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:30px">
        <div class="appic" style="width:64px;height:64px;border-radius:18px;font-size:22px">cU</div>
        <div style="font:700 30px/36px var(--font);letter-spacing:-.03em;margin-top:22px">Your money lives on your computer</div>
        <div style="font-size:15px;line-height:22px;color:var(--color-fg-secondary);margin-top:10px">This phone gets a private copy of the profiles you add to it - to check, search and sort on the go. Nothing readable leaves your devices.</div>
        <div class="rows" style="margin-top:22px">
          <div class="row"><span class="lead lead-ic" style="border-radius:50%;font-weight:650">1</span><span class="n">On the Mac: Settings → Devices</span><span class="v"></span><span class="s">then “Connect a phone”</span></div>
          <div class="row"><span class="lead lead-ic" style="border-radius:50%;font-weight:650">2</span><span class="n">Scan the code it shows</span><span class="v"></span><span class="s">with this phone</span></div>
          <div class="row"><span class="lead lead-ic" style="border-radius:50%;font-weight:650">3</span><span class="n">Type six digits on the Mac</span><span class="v"></span><span class="s">so both sides know it is really you</span></div></div></div>
      <button class="btn primary block" data-act="step:1">${ic('scan', 's')}Scan the code</button>
      <div style="text-align:center;font-size:13px;color:var(--color-fg-muted);margin-top:14px;line-height:18px">Someone at home set cashU up? Ask them to connect your phone on their Mac.</div>`,
    () => `<div style="font:700 24px/30px var(--font);letter-spacing:-.02em;margin-top:6px">Scan the code on your Mac</div>
      <div class="viewfinder"><svg class="qr" viewBox="0 0 21 21" shape-rendering="crispEdges">${qr()}</svg><div class="frame"></div></div>
      <div class="note">${ic('lock', 's')}<span>The code is an invitation for this phone only and expires in 10 minutes.</span></div>
      <div style="flex:1"></div><button class="btn block" data-act="step:2">Simulate a scan</button>`,
    () => `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-bottom:40px">
        <div style="font:700 26px/32px var(--font);letter-spacing:-.025em">Type these digits on your Mac</div>
        <div style="color:var(--color-fg-secondary);margin-top:8px">If the Mac asks for different digits, stop - someone else may be on your network.</div>
        <div class="code"><span>4</span><span>1</span><span>8</span><span class="gap"></span><span>2</span><span>0</span><span>7</span></div>
        <div style="display:flex;justify-content:center;gap:8px;align-items:center;color:var(--color-fg-muted);font-size:13px"><span class="dot acc"></span>Waiting for Anna's MacBook…</div></div>
      <button class="btn block" data-act="step:3">Simulate the Mac confirming</button>`,
    () => `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:30px">
        <span class="lead-ic pos" style="width:52px;height:52px;border-radius:16px">${ic('check', 'l')}</span>
        <div style="font:700 28px/34px var(--font);letter-spacing:-.03em;margin-top:18px">Anna is on this phone</div>
        <div class="group" style="margin-top:20px">
          <div class="row"><span class="lead lead-ic pos">${ic('check', 's')}</span><span class="n">Accounts and this month</span><span class="v muted" style="font-weight:500">ready</span></div>
          <div class="row"><span class="lead lead-ic acc">${ic('sync', 's')}</span><span class="n">History 2019-2026</span><span class="v muted" style="font-weight:500">62%</span><div class="full meter"><i style="width:62%;background:var(--color-accent)"></i></div></div>
          <div class="row"><span class="lead lead-ic">${ic('portfolio', 's')}</span><span class="n">Investments</span><span class="v muted" style="font-weight:500">next</span></div></div>
        <div class="note">${ic('lock', 's')}<span>Stored encrypted on this phone. Turn on Face ID so only you can open it.</span></div></div>
      <button class="btn primary block" data-act="finishpair">Open cashU</button>`,
  ][st];
  return `<div class="screen modal"><div class="scroll" style="padding-top:64px;padding-bottom:44px;display:flex;flex-direction:column">${body()}</div></div>`;
} };
function qr() {
  let s = 7, out = ''; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++) { if (i === 0 || i === 6 || j === 0 || j === 6 || (i > 1 && i < 5 && j > 1 && j < 5)) out += `<rect x="${x + i}" y="${y + j}" width="1" height="1" fill="#fff"/>`; } };
  finder(0, 0); finder(14, 0); finder(0, 14);
  for (let i = 0; i < 21; i++) for (let j = 0; j < 21; j++) { if ((i < 8 && j < 8) || (i > 12 && j < 8) || (i < 8 && j > 12)) continue; if (rnd() > .52) out += `<rect x="${i}" y="${j}" width="1" height="1" fill="#fff"/>`; }
  return out;
}

/* ======================================================================
   Router
   ====================================================================== */
const SHEETS = { profile: profileSheet, cash: cashSheet, alert: alertSheet, tx: txSheet };
const current = () => S.stack.length ? S.stack[S.stack.length - 1] : S.tab;
function render(anim) {
  const [id, variant] = current().split(':');
  if (id !== 'today') S.stale = false;
  const scr = SCREENS[id] || SCREENS.today;
  let html = scr.render(variant);
  if (!anim) html = html.replace('class="screen enter"', 'class="screen"');
  if (S.sheet) {
    const [sid, arg] = S.sheet.split(':');
    html += `<div class="scrim" data-close></div><div class="sheet"><div class="grab"></div>${SHEETS[sid](arg)}</div>`;
  }
  const app = document.getElementById('app'), dev = document.getElementById('device');
  const prevScroll = app.querySelector('.scroll')?.scrollTop || 0;
  app.innerHTML = html;
  dev.classList.toggle('on-lock', id === 'lock'); dev.classList.toggle('on-home', id === 'widget');
  if (!anim && !S.resetScroll) { const sc = app.querySelector('.scroll'); if (sc) sc.scrollTop = prevScroll; }
  S.resetScroll = false;
  if (!anim) app.querySelectorAll('.rise').forEach((e) => e.classList.remove('rise'));
  wire(); renderPanel();
}
function go(id) { S.stack.push(id); S.resetScroll = true; render(true); }
function back() {
  if (S.stack.length) S.stack.pop();
  if (S.returnSheet) { S.sheet = S.returnSheet; S.returnSheet = null; }
  S.resetScroll = true; render(false);
}
function wire() {
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', () => { S.q = q.value; document.getElementById('act-list').innerHTML = activityList(); });
  const top = document.getElementById('dtop');
  if (top) drag(top);
}
function drag(el) {
  let x0 = null, dx = 0;
  el.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; x0 = e.clientX; el.style.transition = 'none'; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', (e) => { if (x0 == null) return; dx = e.clientX - x0; el.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`; });
  el.addEventListener('pointerup', () => { if (x0 == null) return; el.style.transition = ''; x0 = null; const blocked = DECK[S.deck]?.decide && !S.decision && dx > 0; if (Math.abs(dx) > 90 && !blocked) deckNext(dx < 0); else el.style.transform = ''; dx = 0; });
}
function deckNext(flag) {
  const top = document.getElementById('dtop');
  if (flag && !S.deckFlags.includes(S.deck)) S.deckFlags.push(S.deck);
  if (DECK[S.deck]?.decide && !flag) S.decided = true;
  if (top && !S.still) { top.classList.add(flag ? 'gone-l' : 'gone-r'); setTimeout(() => { S.deck++; render(false); }, 260); }
  else { S.deck++; render(false); }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-tab],[data-back],[data-sheet],[data-close],[data-act],[data-filter],[data-key]');
  if (!t || !document.getElementById('device').contains(t)) return;
  if (t.dataset.go) {
    if (t.dataset.go === 'activity') { S.tab = 'activity'; S.stack = []; S.sheet = null; S.resetScroll = true; return render(true); }
    if (t.dataset.go === 'review') { S.deck = 0; S.deckFlags = []; }
    if (S.sheet && t.dataset.go === 'notifs') S.returnSheet = S.sheet.split(':')[0];
    S.sheet = null; return go(t.dataset.go);
  }
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.stack = []; S.sheet = null; S.returnSheet = null; S.resetScroll = true; return render(false); }
  if (t.hasAttribute('data-back')) { S.sheet = null; return back(); }
  if (t.dataset.sheet) { S.sheet = t.dataset.sheet; S.moreCats = false; S.rule = false; return render(false); }
  if (t.hasAttribute('data-close')) { S.sheet = null; return render(false); }
  if (t.dataset.filter) { S.filter = t.dataset.filter; return render(false); }
  if (t.dataset.key) {
    const k = t.dataset.key; let a = S.cashAmt;
    if (k === '⌫') a = a.slice(0, -1); else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; } else if (!(a.includes('.') && a.split('.')[1].length >= 2)) a = (a === '0' ? '' : a) + k;
    S.cashAmt = a; return render(false);
  }
  if (!t.dataset.act) return;
  const [act, a1, a2] = t.dataset.act.split(':');
  if (act === 'incog') S.incog = !S.incog;
  if (act === 'accept') {
    const card = document.getElementById('tri-top');
    S.categorized[a1] = a2; S.rule = false; S.moreCats = false;
    if (card && !S.still) { card.classList.add('out'); setTimeout(() => render(false), 230); return; }
  }
  if (act === 'skip') { const tx = D().tx, l = toCat(); if (l.length) tx.push(tx.splice(tx.indexOf(l[0]), 1)[0]); }
  if (act === 'rule') S.rule = !S.rule;
  if (act === 'morecats') S.moreCats = true;
  if (act === 'settx') S.categorized[a1] = a2;
  if (act === 'cashcat') S.cashCat = a1;
  if (act === 'savecash') S.sheet = null;
  if (act === 'clearq') S.q = '';
  if (act === 'dec') S.decision = a1;
  if (act === 'decide') { S.decided = true; S.sheet = null; }
  if (act === 'later') { S.decided = true; S.decision = null; S.sheet = null; }
  if (act === 'flag') return deckNext(true);
  if (act === 'next') return deckNext(false);
  if (act === 'plan') S.planned = true;
  if (act === 'inv') { S.inv = a1; S.resetScroll = true; }
  if (act === 'reviewend') { S.reviewState = S.deckFlags.length ? 'open' : 'done'; S.sheet = null; return back(); }
  if (act === 'unplan') S.planned = false;
  if (act === 'step') S.step = +a1;
  if (act === 'finishpair') { S.stack = []; S.tab = 'today'; }
  if (act === 'as') { S.as = a1; S.tab = 'today'; S.stack = []; S.sheet = null; }
  render(false);
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const tabs = TABS();
  if (/^[1-4]$/.test(e.key) && tabs[+e.key - 1]) { S.tab = tabs[+e.key - 1][0]; S.stack = []; S.sheet = null; render(false); }
  if (e.key === 'h' || e.key === 'H') { S.incog = !S.incog; render(false); }
  if (e.key === 't' || e.key === 'T') toggleTheme();
  if (e.key === 'p' || e.key === 'P') setAs(isPartner() ? 'owner' : 'partner');
  if (e.key === 'Escape') { if (S.sheet) { S.sheet = null; render(false); } else back(); }
});

/* ---------- side panel ---------- */
const JUMPS = [['today', 'Today'], ['stale', 'Data 3 days old'], ['bigsum', 'Large sum uncategorized'], ['close', 'Month closed'], ['widget', 'Widget'], ['spending', 'Spending'], ['activity', 'Activity'], ['search', 'Search “warta”'], ['triage', 'Categorize'], ['tx', 'Payment'], ['cash', 'Cash'], ['portfolio', 'Investments'], ['signals', 'Signals'], ['strategy', 'Strategy'], ['alert', 'Alert'], ['position', 'Position'], ['review', 'Weekly review'], ['note', 'Note'], ['networth', 'Net worth'], ['loan', 'Mortgage'], ['profile', 'This phone'], ['notifs', 'Notifications'], ['lock', 'Lock screen'], ['pair', 'Pairing']];
function renderPanel() {
  if (P.has('bare')) return;
  const b = (on, act, l) => `<button class="${on ? 'on' : ''}" onclick="${act}">${l}</button>`;
  document.getElementById('panel').innerHTML = `<h1>cashU companion</h1><p>Clickable concept, synthetic data. <a href="index.html">The concept and all screens →</a></p>
    <div class="grp">Whose phone</div><div class="opts">${b(!isPartner(), "setAs('owner')", 'Anna (owner)')}${b(isPartner(), "setAs('partner')", 'Piotr (Home)')}</div>
    <div class="grp">Display</div><div class="opts">${b(S.incog, 'toggleIncog()', 'Hide amounts (H)')}${b(S.theme === 'light', 'toggleTheme()', 'Light (T)')}${b(S.offline, 'toggleOffline()', 'Offline')}</div>
    <div class="grp">Jump to</div><div class="opts">${JUMPS.map(([k, l]) => `<button onclick="jump('${k}')">${l}</button>`).join('')}</div>`;
}
function setAs(a) { S.as = a; S.tab = 'today'; S.stack = []; S.sheet = null; render(false); }
function toggleIncog() { S.incog = !S.incog; render(false); }
function toggleTheme() { S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = S.theme; render(false); }
function toggleOffline() { S.offline = !S.offline; render(false); }
function jump(k) { open(k); S.resetScroll = true; render(true); }

function open(k) {
  S.sheet = null; S.stack = []; S.returnSheet = null; S.q = k === 'search' ? 'warta' : '';
  const ownerOnly = ['signals', 'portfolio', 'alert', 'position', 'review', 'note', 'strategy', 'search', 'cash', 'close'];
  if (ownerOnly.includes(k)) S.as = 'owner';
  if (k === 'loan') S.as = 'partner';
  const sheetBase = { profile: 'today', cash: 'activity', alert: 'portfolio', tx: 'activity' };
  if (k === 'alert') S.inv = 'signals';
  if (sheetBase[k]) { S.tab = sheetBase[k]; S.sheet = k === 'tx' ? `tx:${(toCat()[0] || D().tx[0]).id}` : k; return; }
  if (k === 'stale') { S.tab = 'today'; S.stack = ['today:stale']; return; }
  if (k === 'bigsum') { S.as = 'owner'; S.tab = 'today'; S.stack = ['today:big']; return; }
  if (k === 'search') { S.tab = 'activity'; return; }
  if (k === 'review') S.deck = S.step || 0;
  const scr = SCREENS[k]; if (!scr) { S.tab = 'today'; return; }
  if (scr.init) scr.init(); else if (scr.tab === 'portfolio') S.inv = 'portfolio';
  S.tab = scr.tab; if (!scr.root || k === 'close') S.stack = [k];
}
open(P.get('screen') || 'today');
if (P.get('screen') === 'triage' && P.get('step')) toCat().slice(0, +P.get('step')).forEach((t) => { S.categorized[t.id] = t.sug; });
render(false);
</script>
