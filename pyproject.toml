[project]
name = "cashu"
version = "0.3.9"
description = "cashU: local personal finance and investing companion - bank imports, net worth, spending, loans and investments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cashU contributors" }]
keywords = [
    "personal-finance",
    "budget",
    "net-worth",
    "investments",
    "open-banking",
    "polish-banks",
    "local-first",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Polish",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.12"
# Upper bounds stop before the next major release (0.x packages: before 1.0, sqlmodel
# before 0.1). constraints.txt pins the exact tested set:
#   pip install -e ".[dev]" -c constraints.txt
dependencies = [
    "sqlmodel>=0.0.22,<0.1",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.16,<2",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "cryptography>=43.0,<51",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<16",
    "python-dateutil>=2.9,<3",
    "fastapi>=0.115,<1",
    "starlette>=0.40,<2",
    "uvicorn>=0.30,<1",
    "platformdirs>=4.3,<5",
    "keyring>=25,<26",
    "pyyaml>=6.0,<7",
    # Official MCP SDK (v2 API: mcp.server.Server, stdio transport) for `cashu mcp`.
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/Utopia-USS/cashu"
Repository = "https://github.com/Utopia-USS/cashu"
Issues = "https://github.com/Utopia-USS/cashu/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.6,<1",
]
# `cashu app`: the dashboard in a native window (WKWebView on macOS via pyobjc); native
# notifications through the app bundle (UserNotifications).
desktop = [
    "pywebview>=6.2,<7",
    "pyobjc-framework-UserNotifications>=12.2,<13; sys_platform == 'darwin'",
]

[project.scripts]
cashu = "cashu.cli:app"
# legacy name: the pre-rename command, prints a deprecation line and runs the same CLI
finanse = "cashu.cli:legacy_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashu"]

# The community connector catalog (connectors/) ships read-only inside the package
# (core/connectors/catalog.py: catalog_dir()); a source checkout reads connectors/ directly.
[tool.hatch.build.targets.wheel.force-include]
"connectors" = "cashu/connector_catalog"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The community connector catalog is tested on its own (CI job connectors-catalog, informational):
# `pytest -m catalog tests/test_connector_catalog.py`. A later -m overrides this one.
addopts = ["-m", "not catalog"]
markers = ["catalog: the community connector catalog (connectors/), deselected by default"]
