[project]
name = "finanse"
version = "0.1.0"
description = "Personal finance tracker — bank transaction ingestion (mBank + Erste), net worth, spending & recurring payments"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43.0",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
finanse = "finanse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finanse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
