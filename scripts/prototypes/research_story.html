  { nm: "Medica Health", sym: "MDCA", hl: ["osłabiona", "neg"], line: "Spółka obniża prognozę na ten rok", soon: "wyniki czw 05.11", n: "n4" },
  { nm: "Atomica Energy", sym: "ATMC", hl: ["osłabiona", "neg"], line: "Opóźnienie pierwszego reaktora o rok" },
  { nm: "Bitcoin", sym: "BTC", hl: ["osłabiona", "neg"], line: "Odpływy z funduszy ETF trzeci tydzień" },
  { nm: "Pixel Games", sym: "PXLG", hl: ["bez zmian", "calm"], line: "Nic nowego w tym tygodniu" },
];
note("n6", { h: "Atomica: pierwszy reaktor o rok później", t: "Termin uruchomienia SMR przesunięty z 2028 na 2029", rel: ["osłabia tezę", "neg"], who: "Atomica Energy", kind: "wiadomość", day: 1,
  s: ["Atomica przesunęła uruchomienie pierwszego małego reaktora z 2028 na 2029 rok. Powód: dłuższe pozwolenia."], src: "Atomica Energy, komunikat 28.10" });
note("n7", { h: "Pieniądze odpływają z funduszy na bitcoina", t: "ETF-y BTC: odpływy netto 1,9 mld $ w 3 tygodnie", rel: ["osłabia tezę", "neg"], who: "Bitcoin", kind: "wiadomość", day: 2,
  s: ["Z funduszy ETF na bitcoina odpłynęło w trzy tygodnie około 1,9 mld $."], src: "Example Crypto Flows, 27.10" });
MINE[3].n = "n6"; MINE[4].n = "n7";
const META = { date: "sobota 31.10", total: 79, lead: "Hossa trwa, ale rynek coraz uważniej liczy pieniądze z AI.",
  story: "W sobotę research przejrzał 15 Twoich pozycji i 9 tematów. Najważniejsze: AI pod lupą, ubezpieczyciele zdrowotni pod presją.",
  next: "następny research: sobota 07.11, 07:00 · w Claude Code", srcLabel: "Źródło (przykładowe)" };
const LOST = null; // with real data: what this view keeps one level deeper (render_real.py fills it)
const CANDS = [
  { h: "Gridline Infrastructure", why: "Sieci energetyczne zyskują na budowie centrów danych. Pasuje do Twojej strategii trendu." },
  { h: "Vita Diagnostics", why: "Tańsza od branży po spadkach, a zyski rosną. Pasuje do korekty sentymentu." },
  { h: "Orbit Robotics", why: "Dostawy robotów przemysłowych przyspieszają drugi rok z rzędu." },
];

// ---- rendering ------------------------------------------------------------------------------------------------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pl = (n, one, few, many) => `${n} ${n === 1 ? one : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? few : many}`;
const nowOut = (t) => (t.now || t.out ? `<div class="nowout">${t.now ? `<div><b>Teraz</b>${esc(t.now)}</div>` : ""}${t.out ? `<div><b>Perspektywa</b>${esc(t.out)}</div>` : ""}</div>` : "");
const DAYS = ["Dziś", "Wczoraj", "W tym tygodniu", "W tym tygodniu"];
let openMacro = null, openTopic = null, tab = "topics", filter = "all";

function home() {
  const weak = MINE.filter((m) => m.hl[1] === "neg");
  const drafts = TOPICS.filter((t) => t.draft).length;
  $("#home").innerHTML = `
    <div class="wh"><span class="t">Research</span><span class="mut">${esc(META.date)}</span><span class="sp"></span><button class="lnk" data-go="all">Wszystko · ${META.total} notatek</button></div>
    <div class="home">
      <div>
        <p class="lead">${esc(META.lead)}</p>
        <div class="chips">${MACRO.map((m, i) => `<button class="mchip" aria-expanded="${openMacro === i}" data-m="${i}"><span class="mood ${m.m}">${esc(m.s)}</span><b>${esc(m.k)}</b>${m.nw ? '<span class="new">nowe</span>' : ""}</button>`).join("")}</div>
        ${openMacro != null ? `<div class="mexp">${MACRO[openMacro].x}</div>` : ""}
        <div class="ahead">
          <h4>Nadchodzi</h4>
          <div class="say">${aheadSay()}</div>
          ${AHEAD.map((e) => `<div class="ev"><span class="d"><b>${e.day}</b> ${e.d}</span><span class="${e.mine ? "mine" : ""}">${esc(e.t)}${e.w ? ` <span class="mut">· ${e.w}</span>` : ""}</span><span class="r ${e.big ? "big" : ""}">${esc(e.r)}</span></div>`).join("")}
        </div>
      </div>
      <div>
        ${weak.length ? `<div class="alert"><div class="x"><b>${weak.length === 1 ? "1 teza straciła" : `${weak.length} tezy straciły`} grunt:</b> <span>${weak.map((w) => w.nm).join(", ")}</span></div><button class="btn pri" data-go="all" data-tab="mine">Przejrzyj</button></div>` : ""}
        <div class="col"><h4>Tematy w tym tygodniu</h4></div>
        <div class="topics">${TOPICS.map((t) => `
          <button class="trow" data-t="${t.id}" aria-expanded="${openTopic === t.id}"><span class="nm">${esc(t.nm)}</span><span class="hl"><span class="mood ${t.mood[1]}">${t.mood[0]}</span>${esc(t.hl)}</span><span class="imp">${t.imp}</span></button>
          ${openTopic === t.id ? topicExp(t) : ""}`).join("")}
        </div>
        ${LOST ? `<div class="lost"><b>Schowane głębiej (nic nie znika):</b> ${LOST.map(esc).join(" · ")}</div>` : ""}
        <div class="foot"><span class="mut">Bez nowości: ${QUIET.join(", ")}</span><span class="sp"></span>${drafts ? `<span><span class="badge">${drafts}</span> ${drafts === 1 ? "szkic tezy czeka" : drafts < 5 ? "szkice tez czekają" : "szkiców tez czeka"} na Ciebie</span><button class="btn">Przejrzyj szkice</button>` : ""}</div>
      </div>
    </div>`;
}
function aheadSay() {
  const mine = AHEAD.filter((e) => e.mine).length;
  if (!AHEAD.length) return "Spokojny tydzień: brak ważnych wydarzeń.";
  if (!mine) return "W tym tygodniu żadna Twoja spółka nie podaje wyników.";
  const word = mine === 1 ? "Twoja spółka podaje" : mine < 5 ? "Twoje spółki podają" : "Twoich spółek podaje";
  return `W tym tygodniu ${mine} ${word} wyniki. ${AHEAD.some((e) => e.big) ? "Po raporcie zwykle mocno się ruszają." : "Po raporcie kurs może mocno się ruszyć."}`;
}
function topicExp(t) {
  return `<div class="texp">${nowOut(t)}
    ${t.notes.length ? `<div class="nlist">${t.notes.map((n) => `<button class="nlink" data-n="${n.id}">${esc(n.h)} <span class="mut">· ${DAYS[n.day].toLowerCase()}</span></button>`).join("")}</div>` : ""}</div>`;
}

function all() {
  const weak = MINE.filter((m) => m.hl[1] === "neg").length, strong = MINE.filter((m) => m.hl[1] === "pos").length;
  const notes = Object.values(N);
  const tabs = [["topics", "Tematy", TOPICS.length], ["mine", "Twoje spółki", MINE.length], ["notes", "Notatki", notes.length], ["cal", "Kalendarz", AHEAD.length], ["cand", "Kandydaci", CANDS.length]];
  $("#all").innerHTML = `
    <div class="wh"><span class="t">Research</span><span class="sp"></span><button class="lnk" data-go="home">← Inwestycje</button></div>
    <p class="story">${esc(META.story)}</p>
    <div class="sents">${weak ? `<span class="sent neg">${pl(weak, "teza straciła", "tezy straciły", "tez straciło")} grunt</span>` : ""}${strong ? `<span class="sent pos">${pl(strong, "teza wzmocniona", "tezy wzmocnione", "tez wzmocnionych")}</span>` : ""}${CANDS.length ? `<span class="sent info">${pl(CANDS.length, "nowa okazja", "nowe okazje", "nowych okazji")}</span>` : ""}<span class="sent">nic nie czeka na decyzję</span></div>
    <div class="next">${esc(META.next)}</div>
    <div class="tabs" role="tablist" style="margin-top:18px">${tabs.map(([k, l, n]) => `<button role="tab" aria-selected="${tab === k}" data-tab="${k}">${l}<span class="n">${n}</span></button>`).join("")}</div>
    <div>${tab === "topics" ? allTopics() : tab === "mine" ? allMine() : tab === "notes" ? allNotes(notes) : tab === "cal" ? allCal() : allCands()}</div>`;
}
const allTopics = () => `<div class="tgrid">${TOPICS.map((t) => `
  <article class="tcard"><div class="top"><span class="mood ${t.mood[1]}">${t.mood[0]}</span><span>${esc(t.nm)}</span><span class="sp"></span>${t.draft ? '<span class="draft">szkic tezy</span>' : ""}<span>${t.imp}</span></div>
    <h3>${esc(t.hl)}</h3>
    ${nowOut(t)}
    ${t.notes.length ? `<div class="nlist">${t.notes.map((n) => `<button class="nlink" data-n="${n.id}">${esc(n.h)}</button>`).join("")}</div>` : ""}
    <div class="tick">${t.tick}</div></article>`).join("")}</div>`;
const allMine = () => `<div class="rows">${MINE.map((m) => `
  <div class="prow"><span class="nm">${esc(m.nm)}<small>${m.sym}</small></span><span class="health ${m.hl[1]}">teza ${m.hl[0]}</span>
    <span class="hl2">${m.n ? `<button class="nlink" data-n="${m.n}">${esc(m.line)}</button>` : `<span class="mut">${esc(m.line)}</span>`}</span>${m.soon ? `<span class="soon">${m.soon}</span>` : "<span></span>"}</div>`).join("")}</div>`;
function allNotes(notes) {
  const f = { all: () => true, thesis: (n) => n.rel, results: (n) => n.kind === "wyniki", news: (n) => n.kind === "wiadomość" }[filter];
  const list = notes.filter(f).sort((a, b) => a.day - b.day);
  const groups = [...new Set(list.map((n) => DAYS[n.day]))];
  return `<div class="filters">${[["all", "Wszystkie"], ["thesis", "Dotyczą moich tez"], ["results", "Wyniki spółek"], ["news", "Wiadomości"]].map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join("")}</div>
    ${groups.map((g) => `<div class="day">${g}</div>${list.filter((n) => DAYS[n.day] === g).map((n) => `
      <button class="note" data-n="${n.id}"><i class="${n.rel ? n.rel[1] : ""}"></i><span><span class="h">${esc(n.h)}</span>
        <span class="m">${esc(n.who)} · ${n.kind}${n.rel ? ` · <span class="rel ${n.rel[1]}">${n.rel[0]}</span>` : ""}</span></span></button>`).join("")}`).join("")}`;
}
const allCal = () => `<div class="say" style="font-weight:650;margin-bottom:8px">${aheadSay()}</div>${AHEAD.map((e) => `<div class="ev"><span class="d"><b>${e.day}</b> ${e.d}</span><span class="${e.mine ? "mine" : ""}">${esc(e.t)}${e.w ? ` <span class="mut">· ${e.w}</span>` : ""}</span><span class="r ${e.big ? "big" : ""}">${esc(e.r)}</span></div>`).join("")}`;
const allCands = () => `<div class="rows">${CANDS.map((c) => `<div class="cand"><div><div class="h">${esc(c.h)}</div><div class="m">${esc(c.why)}</div></div><div class="acts"><button class="btn pri">Obserwuj</button><button class="btn">Nie interesuje</button></div></div>`).join("")}</div>`;

function openNote(id) {
  const n = N[id];
  $("#sheet").innerHTML = `<div class="in" role="dialog" aria-modal="true" aria-label="${esc(n.h)}"><button class="close" id="shc">Zamknij</button>
    <div class="ey">${esc(n.who)} · ${n.kind}${n.rel ? ` · ${n.rel[0]}` : ""}</div><h3>${esc(n.h)}</h3><div class="tech">${esc(n.t)}</div>
    ${n.s.map((p) => `<p>${esc(p)}</p>`).join("")}<div class="srcs">${META.srcLabel ?? "Źródło"}: ${esc(n.src)}</div></div>`;
  $("#sheet").hidden = false;
  $("#shc").focus();
}

// ---- events ---------------------------------------------------------------------------------------------------
function show(view, t) {
  if (t) tab = t;
  $("#home").hidden = view !== "home"; $("#all").hidden = view !== "all";
  $("#vHome").setAttribute("aria-pressed", view === "home"); $("#vAll").setAttribute("aria-pressed", view === "all");
  view === "home" ? home() : all();
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, .sheet");
  if (!el) return;
  if (el.id === "sheet" && e.target === el) { el.hidden = true; return; }
  if (el.id === "shc") { $("#sheet").hidden = true; return; }
  if (el.id === "vHome") return show("home");
  if (el.id === "vAll") return show("all");
  const d = el.dataset;
  if (d.go) return show(d.go, d.tab);
  if (d.m != null) { openMacro = openMacro === +d.m ? null : +d.m; return home(); }
  if (d.t) { openTopic = openTopic === d.t ? null : d.t; return home(); }
  if (d.n) return openNote(d.n);
  if (d.tab) { tab = d.tab; return all(); }
  if (d.f) { filter = d.f; return all(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#sheet").hidden = true; });
show("home");
</script>
