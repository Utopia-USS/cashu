# Alembic config for developers working in a source checkout, e.g.:
#   alembic revision --autogenerate -m "add profiles"
#   alembic upgrade head
# The app itself does not read this file: `cashu init-db` / `cashu serve`
# (db.init_db) run the same migrations programmatically. The database URL comes
# from cashu's own settings (CASHU_DATABASE_URL or the data dir), never from
# here, so point CASHU_DATA_DIR at a scratch dir while developing migrations.

[alembic]
script_location = %(here)s/src/cashu/core/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
