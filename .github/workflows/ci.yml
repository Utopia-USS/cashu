# Lint and tests for every pull request and every push to main. Tests run on synthetic data only
# (tests/conftest.py points the data dir, HOME and workspaces at temp dirs).
# Windows is informational for now: the app is meant to run on every OS eventually, so its
# failures are visible but do not block a merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        # constraints.txt pins the tested versions (ruff included, so new lint rules never break CI
        # unannounced); packages it does not list (platform-specific ones) resolve freely.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  checks:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      - name: Connector schemas are up to date
        run: python scripts/gen_connector_schemas.py --check

      - name: Skill reference copies are up to date
        run: python scripts/sync_skill_references.py --check

  # The community connector catalog (connectors/, contrib status): every entry's manifest and catalog
  # fields, and `cashu connectors test` on its fixtures in the real macOS sandbox. Informational: a
  # broken or stale community connector is flagged here but never blocks a core pull request.
  connectors-catalog:
    name: Connector catalog (informational)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      - name: Catalog tests
        run: pytest -q -m catalog tests/test_connector_catalog.py
