# Raise the app version after every push to main, so installed apps see the change through their
# update check (src/cashu/core/updates.py reads project.version of pyproject.toml on main).
# Patch by default; "[minor]" / "[major]" in a pushed commit message raises that part instead,
# "[skip bump]" or a hand-made version change in the push skips the bump (scripts/bump_version.py).
name: Bump version

on:
  push:
    branches: [main]

permissions:
  contents: write

# One bump at a time; a push that lands while a bump runs gets its own bump afterwards.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    # The bump commit is pushed with GITHUB_TOKEN, which never starts another run; the guard is a backstop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version="$(python3 scripts/bump_version.py --since "$BEFORE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump version to $VERSION [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
