# Every push to staging opens (or reuses) the staging -> main pull request, so changes reach main in one
# reviewed merge (docs/agents/conventions.md rule 5). Pushing to staging bumps no version and releases nothing:
# the bump runs on main, and a release to installed apps is a separate local step (packaging/RELEASING.md).
name: Staging -> main PR

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse the staging -> main PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --repo "$REPO" --base main --head staging --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open"
          else
            gh pr create --repo "$REPO" --base main --head staging \
              --title "Release: staging -> main" \
              --body "Automatic pull request from staging. Merging it lands the changes on main (the version bump follows). A release to installed apps stays a separate step: packaging/RELEASING.md."
          fi
