# Every push to staging opens (or reuses) the staging -> main pull request, so changes reach main in one
# reviewed merge (docs/agents/conventions.md rule 5). Pushing to staging bumps no version and releases nothing:
# the bump runs on main, then release-macos.yml builds the release and waits for the owner's approval in the
# `release` environment (apps/desktop/scripts/release-macos.mjs stays the owner's local fallback).
name: Staging -> main PR

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse the staging -> main PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --repo "$REPO" --base main --head staging --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open"
          else
            gh pr create --repo "$REPO" --base main --head staging \
              --title "Release: staging -> main" \
              --body "Automatic pull request from staging. Merging it lands the changes on main: the version bump follows, then the macOS release workflow, which publishes to installed apps after the owner approves it in the release environment."
          fi
