# TypeScript monorepo (pnpm + turbo): typecheck, lint and tests for every package and app.
name: TypeScript

on:
  pull_request:
  push:
    branches: [main, staging, ts-stack]

permissions:
  contents: read

concurrency:
  group: ts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Only GitHub-owned actions are allowed in this repository, each pinned to a full commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # setup-node v5 turns on the pnpm cache by itself when package.json names a packageManager, before pnpm
      # exists, and fails; pnpm comes from Corepack in the next step.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # pnpm at the exact version of "packageManager" in the root package.json (Corepack ships with Node).
      - name: Install
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Typecheck, lint
        run: pnpm turbo run typecheck lint

      # At most 4 packages at once, each vitest on a quarter of the cores (vitest.tiers.ts); --continue so
      # one run reports every failing package.
      - name: Test
        run: pnpm test --continue

      # The exhaustive tier (*.exhaustive.test.ts: code point sweeps, vector replays, property searches,
      # multi-device simulations), one package at a time so each suite has the runner's cores to itself.
      - name: Exhaustive tests
        run: pnpm test:exhaustive

      # Layers, module boundaries, pure Views, React hooks / Compiler rules, unused code, package
      # hygiene and the UI guards (tools/arch). Prints the TRANSITIONAL report too.
      - name: Architecture checks
        run: pnpm arch:check

      # The mobile JS budget (performance.md "Bundles": the Hermes bytecode ratchet ceiling), iOS and Android
      # production bundles from `expo export` (no native toolchain needed). Once per run is enough.
      - name: Mobile bundle budget
        if: matrix.os == 'ubuntu-latest'
        run: pnpm bundle:check
