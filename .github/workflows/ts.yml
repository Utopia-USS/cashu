# TypeScript monorepo (pnpm + turbo): typecheck, lint and tests for every package and app.
name: TypeScript

on:
  pull_request:
  push:
    branches: [main, staging, ts-stack]

permissions:
  contents: read

concurrency:
  group: ts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Only GitHub-owned actions are allowed in this repository, each pinned to a full commit SHA.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # setup-node v5 turns on the pnpm cache by itself when package.json names a packageManager, before pnpm
      # exists, and fails; pnpm comes from Corepack in the next step.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # pnpm at the exact version of "packageManager" in the root package.json (Corepack ships with Node).
      - name: Install
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Typecheck, lint
        run: pnpm turbo run typecheck lint

      # At most 4 packages at once, each vitest on a quarter of the cores (vitest.tiers.ts); --continue so
      # one run reports every failing package.
      - name: Test
        run: pnpm test --continue

      # The exhaustive tier (*.exhaustive.test.ts: code point sweeps, vector replays, property searches,
      # multi-device simulations), one package at a time so each suite has the runner's cores to itself.
      - name: Exhaustive tests
        run: pnpm test:exhaustive

      # Layers, module boundaries, pure Views, React hooks / Compiler rules, unused code, package
      # hygiene and the UI guards (tools/arch). Prints the TRANSITIONAL report too.
      - name: Architecture checks
        run: pnpm arch:check

      # The mobile JS budget (performance.md "Bundles": the Hermes bytecode ratchet ceiling), iOS and Android
      # production bundles from `expo export` (no native toolchain needed). Once per run is enough.
      - name: Mobile bundle budget
        if: matrix.os == 'ubuntu-latest'
        run: pnpm bundle:check

  # The security boundary of the sync relay (S4): firestore.rules and the Firestore relay transport against
  # the Firestore + Auth emulators (project `demo-cashu`, offline, no login, never a real project; nothing
  # is deployed), then the end-to-end run of a native host and a Node joiner under those rules (pairing,
  # sync both ways, ciphertext-only documents, purge; apps/host/src/testing/relayE2e.emulator.test.ts).
  # The fake Firebase of the `ts` job applies no rules, so only this job tests them.
  emulator:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    env:
      # firebase-tools pinned; `pnpm test:emulator` runs it through this variable.
      CASHU_FIREBASE: npx --yes firebase-tools@15.14.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The emulators run on the JVM (Java 21+).
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # The emulator jars firebase-tools downloads on first use, per pinned firebase-tools version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.14.0

      - name: Install
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Emulator tests
        run: pnpm test:emulator

  # Windows (x64 beta): the suites the Windows port made platform-aware (node-host: named pipes, private files,
  # Credential Manager; cli: data dir, launcher, signals; host), an unsigned installer from
  # apps/desktop/scripts/package-windows.mjs, and a packaged smoke test of that installer
  # (apps/desktop/scripts/smoke-windows.mjs: silent per-user install into a temp folder, the installed shim
  # against a fresh temp data dir, host start, launcher, a synthetic vault with its key in the Credential
  # Manager, a restart reading it back, a stable build id, uninstall). The steps after Install run even when an
  # earlier suite failed, so one run reports every failing part; the smoke needs the installer.
  windows:
    name: Windows (tests, installer, smoke)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Byte-identical files: the skills and the connector catalog ship in the package and are hashed into its
      # manifest, so git must not turn LF into CRLF on checkout (the runner image's default).
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # DIAGNOSTIC only (never fails the job): which entries a freshly created folder carries in the user's profile
      # Temp, in %LOCALAPPDATA% (the default data dir's parent) and in RUNNER_TEMP, and what is left after the
      # icacls call that the owner-only data dir DACL starts with (packages/node-host/src/host/windowsAcl.ts).
      # Prints SIDs (SDDL) only, for the owner-only DACL work; drop it once that is settled on real runners.
      - name: "Diagnostic: ACLs of a fresh folder (owner-only data dir)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $sys32 = Join-Path $env:SystemRoot 'System32'
          $icacls = Join-Path $sys32 'icacls.exe'
          $whoami = Join-Path $sys32 'whoami.exe'
          $sid = ((& $whoami /user /fo csv /nh) -split ',')[-1].Trim().Trim('"')
          Write-Output "user SID: $sid"
          & $whoami /groups /fo csv /nh | Select-String -SimpleMatch '"S-1-16-'
          function Show-Sddl([string]$label, [string]$path) {
            $listing = Join-Path $env:RUNNER_TEMP ('acl-diag-' + [guid]::NewGuid().ToString('N'))
            & $icacls $path /save $listing /q | Out-Null
            $owner = (Get-Acl -LiteralPath $path).Sddl -replace 'D:.*$', ''
            $dacl = (Get-Content -LiteralPath $listing -Encoding Unicode | Select-Object -Skip 1 -First 1)
            Write-Output "  $label  $owner  $dacl"
            Remove-Item -LiteralPath $listing -Force -ErrorAction SilentlyContinue
          }
          foreach ($parent in @($env:TEMP, $env:LOCALAPPDATA, $env:RUNNER_TEMP)) {
            Write-Output "== $parent"
            Show-Sddl 'parent' $parent
            $dir = Join-Path $parent ('acl-diag-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $dir | Out-Null
            Show-Sddl 'fresh ' $dir
            & $icacls $dir /inheritance:r /grant:r "*${sid}:(OI)(CI)F" '*S-1-5-18:(OI)(CI)F' /q | Out-Null
            Write-Output "  icacls /inheritance:r /grant:r exit $LASTEXITCODE"
            Show-Sddl 'after ' $dir
            Remove-Item -LiteralPath $dir -Recurse -Force
          }

      - name: Install
        id: install
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Test node-host
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @cashu/node-host test

      - name: Test cli
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @cashu/cli test

      - name: Test host
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @cashu/host test

      # Unsigned (no secrets in this workflow): the same build the release's `windows` job signs.
      - name: Build the installer (unsigned)
        id: package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node apps/desktop/scripts/package-windows.mjs x64 --out "$RUNNER_TEMP/cashu-windows"

      - name: Packaged smoke test
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          version="$(node -p 'require("./apps/desktop/package.json").version')"
          node --experimental-strip-types --import ./tools/node-ts/resolveTs.ts \
            apps/desktop/scripts/smoke-windows.mjs "$RUNNER_TEMP/cashu-windows/cashU-$version-win-x64.exe" \
            --unpacked build/t46/electron-builder/win-unpacked
