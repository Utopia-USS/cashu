name: Feature request
description: An idea for cashU.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Support for a new bank, broker or exchange is not a feature request: use the
        "New data source" template, new sources are connectors.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like cashU to do. Mention the module (budget, assets, loans, investments) if it is specific to one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The idea keeps data local, or it says clearly what would leave the machine and why.
