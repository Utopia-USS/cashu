<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>finanse</title>
  <style>
    :root { --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6b7280; --border: #e5e7eb; --chip: #eef1f5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1216; --card: #171b21; --text: #e6e8eb; --muted: #9aa4b2; --border: #262c34; --chip: #232a33; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 12vh auto 0; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0 0 12px; color: var(--muted); }
    pre { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--chip); color: var(--text);
      font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto;
      font-variant-ligatures: none; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Interfejs nie jest zbudowany</h1>
      <p>Serwer finanse działa, ale brakuje zbudowanego frontendu (<code>src/finanse/api/webdist/</code>).
        Zbuduj go raz w katalogu repozytorium:</p>
      <pre>cd frontend &amp;&amp; npm ci &amp;&amp; npm run build</pre>
      <p>Potem odśwież tę stronę (albo uruchom ponownie <code>finanse serve</code>).</p>
    </div>
  </main>
</body>
</html>
